<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>タップの波紋（全画面共通）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Shippori+Mincho:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.en{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase}
.rp{position:absolute;width:0;height:0;pointer-events:none;z-index:50}
.rp span{position:absolute;display:block}
/* A 菱形が広がる */
.A .d1{left:-14px;top:-14px;width:28px;height:28px;box-sizing:border-box;border:1px solid var(--c);transform:rotate(45deg) scale(.3);animation:aD1 var(--t) cubic-bezier(.2,.8,.3,1) both;box-shadow:0 0 0 1px rgba(6,6,10,.35)}
.A .d2{left:-4px;top:-4px;width:8px;height:8px;background:var(--c);transform:rotate(45deg);animation:aD2 var(--t) ease both;box-shadow:0 0 8px 2px var(--g)}
@keyframes aD1{from{transform:rotate(45deg) scale(.3);opacity:1}to{transform:rotate(45deg) scale(2.1);opacity:0}}
@keyframes aD2{0%{transform:rotate(45deg) scale(1.4);opacity:1}100%{transform:rotate(45deg) scale(.2);opacity:0}}
/* B 光の十字（タイトルの星） */
.B .h{left:-40px;top:-.5px;width:80px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),var(--c) 50%,rgba(255,255,255,0));animation:bH var(--t) cubic-bezier(.2,.8,.3,1) both}
.B .v{left:-.5px;top:-24px;width:1px;height:48px;background:linear-gradient(180deg,rgba(255,255,255,0),var(--c) 50%,rgba(255,255,255,0));animation:bV var(--t) cubic-bezier(.2,.8,.3,1) both}
.B .o{left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff 30%,var(--c) 60%,rgba(255,255,255,0) 72%);box-shadow:0 0 12px 3px var(--g);animation:bO var(--t) ease both}
@keyframes bH{0%{transform:scaleX(.1);opacity:1}40%{opacity:1}100%{transform:scaleX(1.4);opacity:0}}
@keyframes bV{0%{transform:scaleY(.1);opacity:1}40%{opacity:1}100%{transform:scaleY(1.2);opacity:0}}
@keyframes bO{0%{transform:scale(1.3);opacity:1}100%{transform:scale(.3);opacity:0}}
/* C 細い輪と菱形の粒 */
.C .r{left:-18px;top:-18px;width:36px;height:36px;box-sizing:border-box;border:1px solid var(--c);border-radius:50%;animation:cR var(--t) cubic-bezier(.2,.8,.3,1) both}
.C .p{left:-2.5px;top:-2.5px;width:5px;height:5px;background:var(--c);transform:rotate(45deg);animation:cP var(--t) cubic-bezier(.2,.8,.3,1) both}
.C .p2{animation-name:cP2}.C .p3{animation-name:cP3}.C .p4{animation-name:cP4}
@keyframes cR{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
@keyframes cP{from{transform:translate(0,0) rotate(45deg);opacity:1}to{transform:translate(0,-30px) rotate(45deg);opacity:0}}
@keyframes cP2{from{transform:translate(0,0) rotate(45deg);opacity:1}to{transform:translate(30px,0) rotate(45deg);opacity:0}}
@keyframes cP3{from{transform:translate(0,0) rotate(45deg);opacity:1}to{transform:translate(0,30px) rotate(45deg);opacity:0}}
@keyframes cP4{from{transform:translate(0,0) rotate(45deg);opacity:1}to{transform:translate(-30px,0) rotate(45deg);opacity:0}}
.tile{transition:background .15s}
.tile:active{background:rgba(34,31,44,.94) !important}
@media (prefers-reduced-motion: reduce){.rp span{animation-duration:.01s !important}}
</style>
</helmet>
<div class="tapRoot" onClick="{{tap}}" style="position: relative; width: 1688px; height: 780px; overflow: hidden; background: #0d0c12; font-family: 'Shippori Mincho', serif; color: #f1efe9; cursor: pointer; user-select: none">
  <img src="/_blob/de575dd30944303d13ab60b42a0d464e" alt="" style="position: absolute; inset: 0; width: 1688px; height: 780px; display: block; filter: brightness(.6)">
  <div style="position: absolute; left: 110px; top: 120px; display: flex; flex-direction: column; gap: 6px; pointer-events: none">
    <span class="en" style="font-size: 15px; font-weight: 600; letter-spacing: 0.34em; color: #e4e7ec">Tap Feedback</span>
    <span style="font-size: 40px; font-weight: 800; letter-spacing: 0.12em">どこを押しても、波紋が出る</span>
    <span style="font-size: 18px; letter-spacing: 0.08em; color: #b8b5ae">ボタンの上は少し強く、何もない所は控えめに。Tweaks で形を切り替え</span>
  </div>
  <div style="position: absolute; left: 110px; top: 300px; display: flex; flex-direction: column; gap: 14px; width: 460px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="3">
      <div class="tile btnT" style="height: 76px; padding: 0 24px; background: rgba(16,14,24,0.72); display: flex; align-items: center; gap: 14px; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%)">
        <span style="width: 7px; height: 7px; background: #e4e7ec; transform: rotate(45deg)"></span>
        <span style="font-size: 24px; font-weight: 800; letter-spacing: 0.12em">{{t.ja}}</span>
        <span class="en" style="font-size: 12px; font-weight: 600; letter-spacing: 0.3em; color: #a59e90">{{t.en}}</span>
      </div>
    </sc-for>
  </div>
  <sc-for list="{{rips}}" as="r" hint-placeholder-count="0">
    <span class="rp {{r.cls}}" style="left: {{r.x}}px; top: {{r.y}}px; --c: {{r.c}}; --g: {{r.g}}; --t: {{r.t}}">
      <span class="d1"></span><span class="d2"></span>
      <span class="h"></span><span class="v"></span><span class="o"></span>
      <span class="r"></span><span class="p"></span><span class="p p2"></span><span class="p p3"></span><span class="p p4"></span>
    </span>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"shape": {"editor": "enum", "default": "菱形が広がる", "options": ["菱形が広がる", "光の十字", "輪と粒"]}, "color": {"editor": "enum", "default": "銀", "options": ["銀", "ティール", "金"]}, "$preview": {"width": 1688, "height": 780}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { rips: [], n: 0 }; this.tm = []; }
  componentWillUnmount() { this.tm.forEach(clearTimeout); }
  tap(e) {
    var s = this, el = e.target && e.target.closest ? e.target.closest('.tapRoot') : null; if (!el) return;
    var r = el.getBoundingClientRect(), k = r.width / 1688;
    var x = Math.round((e.clientX - r.left) / k), y = Math.round((e.clientY - r.top) / k);
    var onBtn = !!(e.target.closest && e.target.closest('.btnT'));
    var n = this.state.n + 1, shape = { '菱形が広がる': 'A', '光の十字': 'B', '輪と粒': 'C' }[this.props.shape ?? '菱形が広がる'];
    var col = { '銀': ['#eef0f4', 'rgba(214,226,240,.55)'], 'ティール': ['#4fa3a8', 'rgba(79,163,168,.6)'], '金': ['#e2b04a', 'rgba(242,196,96,.55)'] }[this.props.color ?? '銀'];
    var item = { id: n, x: x, y: y, cls: shape + (onBtn ? ' strong' : ''), c: col[0], g: onBtn ? col[1] : 'rgba(0,0,0,0)', t: onBtn ? '.5s' : '.42s' };
    this.setState({ rips: this.state.rips.concat([item]).slice(-6), n: n });
    this.tm.push(setTimeout(function () { s.setState({ rips: s.state.rips.filter(function (q) { return q.id !== n; }) }); }, 700));
  }
  renderVals() {
    var s = this;
    return {
      tap: function (e) { s.tap(e); },
      tiles: [{ ja: '続きから', en: 'Continue' }, { ja: '支援会話', en: 'Support' }, { ja: '設定', en: 'Config' }],
      rips: this.state.rips.map(function (r) { return { x: r.x, y: r.y, cls: r.cls, c: r.c, g: r.g, t: r.t }; })
    };
  }
}
</script>
</body>
</html>
