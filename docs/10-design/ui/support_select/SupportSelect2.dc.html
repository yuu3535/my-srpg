<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0}
.en{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase}
button{font-family:inherit;color:inherit}
.btn:focus-visible{outline:2px solid #f3cd78;outline-offset:3px}
.glass{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dots{background-image:radial-gradient(circle,rgba(241,234,217,.5) 1.1px,transparent 1.6px);background-size:16px 16px;opacity:.4;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.15) 30%,#000 78%,#000 100%);mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.15) 30%,#000 78%,#000 100%)}
.dl{animation:dlIn .6s cubic-bezier(.2,.9,.25,1) both}
.dl.on{animation:dlOn .8s cubic-bezier(.2,.9,.25,1) both}
@keyframes dlIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes dlOn{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
.panel{animation:panelIn .55s .15s cubic-bezier(.2,.9,.25,1) both}
@keyframes panelIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.bond{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.bond > *{pointer-events:none}
.bond:hover{transform:translateY(-6px)}
.bond.sel{transform:translateY(-10px)}
.bond .chara{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.bond:hover .chara{transform:scale(1.05)}
.bond .bd-frame{stroke:rgba(201,205,210,.75);transition:stroke .25s}
.bond:hover .bd-frame{stroke:rgba(243,205,120,.95)}
.bond.sel .bd-frame{stroke:#e2b04a;stroke-width:1.6}
.bond .cn{opacity:0;transition:opacity .25s}
.bond.sel .cn{opacity:1}
.dot{animation:badge 2.2s ease-in-out infinite}
@keyframes badge{0%,100%{box-shadow:0 0 0 0 rgba(242,196,96,.55)}50%{box-shadow:0 0 0 7px rgba(242,196,96,0)}}
.pip{position:relative;width:28px;height:28px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center}
.pip .pd{position:absolute;left:4px;top:4px;width:20px;height:20px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:rgba(201,205,210,.42)}
.pip .pi{position:absolute;inset:1px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:rgba(14,12,20,.8)}
.pip .pf{display:none}
.pip b{position:relative;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:#a59e90}
.pip.on .pd{background:var(--rc)}
.pip.on .pi{background:var(--rc)}
.pip.on b{color:#121019}
.pip.ready .pd{background:var(--rc);animation:rkb 3.2s ease-in-out infinite}
.pip.ready b{color:var(--rc);animation:rkb 3.2s ease-in-out infinite}
@keyframes rkb{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.pip.ready .pd,.pip.ready b{animation:none}}
.scr{scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
.scr::-webkit-scrollbar{display:none}
.more{display:flex;gap:10px;align-items:center;transition:opacity .3s}
.more.off{opacity:0}
.more i{display:block;width:9px;height:9px;box-sizing:border-box;border:1px solid;transform:rotate(45deg);animation:hop3 3.6s cubic-bezier(.3,.7,.3,1) infinite,col3 9s linear infinite}
.more i:nth-child(2){animation-delay:.22s,-6s}
.more i:nth-child(3){animation-delay:.44s,-3s}
@keyframes hop3{0%,16%,100%{transform:translateY(0) rotate(45deg)}6%{transform:translateY(-6px) rotate(45deg)}11%{transform:translateY(0) rotate(45deg)}}
@keyframes col3{0%,100%{border-color:#4fa3a8;background:rgba(79,163,168,.28);box-shadow:0 0 6px rgba(79,163,168,.5)}33.3%{border-color:#e2b04a;background:rgba(226,176,74,.28);box-shadow:0 0 6px rgba(242,196,96,.5)}66.6%{border-color:#c9cdd2;background:rgba(201,205,210,.18);box-shadow:0 0 5px rgba(214,226,240,.35)}}
@media (prefers-reduced-motion: reduce){.more i{animation:none;border-color:#4fa3a8}.more i:nth-child(2){border-color:#e2b04a}.more i:nth-child(3){border-color:#c9cdd2}}
.seg{display:flex;align-items:center;gap:2px}
.sg{position:relative;height:28px;padding:0 8px 0 18px;border:0;background:none;color:#8f887b;font-size:13px;font-weight:700;letter-spacing:.12em;cursor:pointer;transition:color .2s}
.sg::before{content:'';position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;box-sizing:border-box;border:1px solid rgba(201,205,210,.45);transform:rotate(45deg);transition:background .2s,border-color .2s}
.sg + .sg{margin-left:6px}
.sg:hover{color:#f1ead9}
.sg.on{color:#f3cd78}
.sg.on::before{background:#e2b04a;border-color:#e2b04a;box-shadow:0 0 5px rgba(242,196,96,.6)}
.mini{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.mini > *{pointer-events:none}
.mini:hover{transform:translateY(-3px)}
.mini .mf{background:rgba(201,205,210,.3)}
.mini:hover .mf{background:rgba(243,205,120,.9)}
.mini.sel .mf{background:#e2b04a}
.mini.sel .mn{color:#f3cd78}
.mini.sel{background:rgba(40,33,26,.78) !important}
.crow .go2{transition:background .2s}
.crow .go2:hover{background:rgba(34,31,44,.94)}
.pip.sm{width:22px;height:22px}
.pip.sm .pd{left:3px;top:3px;width:16px;height:16px}
.pip.sm b{font-size:9px}
.tile{transition:background .2s}
.tile:hover{background:rgba(34,31,44,.94)}
.arr{transition:opacity .2s,color .2s}
.arr:hover{color:#f3cd78 !important}
.arr.off{opacity:.25;pointer-events:none}
.star-btn .star{transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .3s;filter:drop-shadow(0 0 6px rgba(242,196,96,.5));animation:twinkle 3.4s ease-in-out infinite}
.star-btn:hover .star{transform:rotate(45deg) scale(1.12);filter:drop-shadow(0 0 14px rgba(255,214,120,.95))}
@keyframes twinkle{0%,100%{opacity:.82}50%{opacity:1}}
.veil{animation:veil 1.9s ease both}
@keyframes veil{0%{opacity:0}18%{opacity:1}78%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.dl,.dl.on,.panel,.dot,.star-btn .star,.veil{animation:none}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"members": {"editor": "enum", "default": "5人", "options": ["5人", "8人"]}, "quiet": {"editor": "boolean", "default": false}, "$preview": {"width": 1688, "height": 780}}'>
var IMG = {
  arshe: { src: '/_blob/8c8b6c6a0ec1d8e9bbb118d2400bf24e', w: 284, h: 950, fx: 150, fy: 98, hw: 106 },
  karima: { src: '/_blob/f33eab7e9e20acad67484fdf416a807a', w: 233, h: 950, fx: 125, fy: 100, hw: 104 },
  carrie: { src: '/_blob/fdebbf55670b101103e1d1fe80dad9d9', w: 491, h: 1060, fx: 242, fy: 86, hw: 86 },
  albus: { src: '/_blob/88e849ff96372e86028ac67572a0af41', w: 286, h: 1000, fx: 140, fy: 66, hw: 80 },
  henry: { src: '/_blob/cd9140bae698738717740b94a5fabdc8', w: 401, h: 1000, fx: 173, fy: 82, hw: 90 }
};
var ARMY = {
  ar: { ja: 'アルシェ軍', en: 'Arshe side', word: 'ARSHE', cls: 'v-ar', list: [
    { id: 'arshe', name: 'アルシェ', en: 'Arshe', img: 'arshe', lead: true },
    { id: 'albus', name: 'アルバス', en: 'Albus', img: 'albus', shared: true },
    { id: 'ringholm', name: 'リングホルム', en: 'Ringholm' },
    { id: 'ann', name: 'アン', en: 'Ann' },
    { id: 'philo', name: 'フィロ', en: 'Philo' }
  ] },
  ka: { ja: 'カリマ軍', en: 'Karima side', word: 'KARIMA', cls: 'v-ka', list: [
    { id: 'karima', name: 'カリマ', en: 'Karima', img: 'karima', lead: true },
    { id: 'bell', name: 'ベル', en: 'Bell' },
    { id: 'henry', name: 'ヘンリー', en: 'Henry', img: 'henry' },
    { id: 'carrie', name: 'キャリー', en: 'Carrie', img: 'carrie' },
    { id: 'radin', name: 'ラディン', en: 'Radin' },
    { id: 'albus', name: 'アルバス', en: 'Albus', img: 'albus', shared: true }
  ] }
};
// 確認用に手で決めた組み合わせ（それ以外は名前から仮の値を作る）
var FIX = {
  'albus|arshe': { r: 1, s: 'ready' }, 'arshe|ringholm': { r: 2, s: 'gauge', p: 64 }, 'ann|arshe': { r: 0, s: 'ready' },
  'arshe|philo': { r: 0, s: 'locked', ch: 3 }, 'albus|ringholm': { r: 3 }, 'albus|ann': { r: 0, s: 'gauge', p: 22 },
  'albus|karima': { r: 2, s: 'ready' }, 'bell|karima': { r: 1, s: 'gauge', p: 48 }, 'henry|karima': { r: 0, s: 'ready' },
  'carrie|karima': { r: 3 }, 'karima|radin': { r: 0, s: 'locked', ch: 4 }
};
var PER_ROW = 5, PER_CARD = 12;
function hsh(s) { var h = 7; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 100003; return h; }
function crop(key, bw, bh, cx, cy, head) {
  var m = IMG[key]; var s = head / m.hw;
  return 'left: ' + Math.round(cx - m.fx * s) + 'px; top: ' + Math.round(cy - m.fy * s) + 'px; width: ' + Math.round(m.w * s) + 'px; height: ' + Math.round(m.h * s) + 'px';
}
function pairOf(a, b) {
  var k = [a.id, b.id].sort().join('|');
  if (FIX[k]) return FIX[k];
  var h = hsh(k);
  if (!a.lead && !b.lead && h % 5 === 0) return null;
  var r = h % 4;
  if (r === 3) return { r: 3 };
  var t = (h >> 3) % 3;
  if (t === 0) return { r: r, s: 'ready' };
  if (t === 1) return { r: r, s: 'gauge', p: 10 + (h % 80) };
  return { r: r, s: 'locked', ch: 2 + (h % 5) };
}
var RANKS = ['C', 'B', 'A'];
function dotStyle(on) {
  return on ? 'border: 1px solid var(--ac); background: var(--ac); box-shadow: 0 0 6px var(--acg)' : 'border: 1px solid var(--ln)';
}


var PER_ROW2 = 4, PER_CARD2 = 7;
// 主人公以外の組み合わせは限定（仮の割り当て。登場順・確定枠はまだ決まっていない）
var LINKS = ['albus|ringholm', 'albus|ann', 'philo|ringholm', 'ann|r06', 'philo|r07', 'albus|r08', 'ann|philo'];
var pairBase = pairOf;
pairOf = function (a, b) {
  if (!a.lead && !b.lead && LINKS.indexOf([a.id, b.id].sort().join('|')) < 0) return null;
  return pairBase(a, b);
};
var RC = ['#e2b04a', '#6cc6d6', '#d9475a'];
function fadeMask(dir, a, b, fa, fb) {
  if (!a && !b) return '';
  var g = 'linear-gradient(' + dir + ', ' + (a ? 'transparent 0, #000 ' + fa + 'px' : '#000 0') + ', ' + (b ? '#000 calc(100% - ' + fb + 'px), transparent 100%' : '#000 100%') + ')';
  return '-webkit-mask-image: ' + g + '; mask-image: ' + g;
}
function dot2(on) { return on ? 'border: 1px solid #4fa3a8; background: rgba(79,163,168,0.25); box-shadow: 0 0 6px rgba(79,163,168,0.55)' : 'border: 1px solid rgba(201,205,210,0.5)'; }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0, cs: 0, rs: 0, go: null, mv: 'card', bv: 'full' };
  }
  componentWillUnmount() { clearTimeout(this.tg); }
  roster() {
    var list = ARMY.ar.list.slice();
    var m = this.props.members ?? '8人';
    var want = m === '8人' ? 8 : list.length;
    for (var i = list.length; i < want; i++) {
      var no = ('0' + (i + 1)).slice(-2);
      list.push({ id: 'r' + no, name: '加入キャラ' + no, en: 'Recruit ' + no });
    }
    return list;
  }
  launch(a, b, rank, replay) {
    var self = this;
    clearTimeout(this.tg);
    this.setState({ go: { a: a.name, b: b.name, rank: rank, replay: replay } });
    this.tg = setTimeout(function () { self.setState({ go: null }); }, 1900);
  }
  renderVals() {
    var self = this;
    var list = this.roster();
    var sel = Math.min(this.state.sel, list.length - 1);
    var me = list[sel];
    var readyOf = function (who) {
      var n = 0; list.forEach(function (o) { if (o !== who) { var p = pairOf(who, o); if (p && p.s === 'ready' && p.r < 3) n++; } }); return n;
    };
    var partnersOf = function (who) { var n = 0; list.forEach(function (o) { if (o !== who && pairOf(who, o)) n++; }); return n; };
    var pairs = [];
    list.forEach(function (o, i) { if (i !== sel) { var p = pairOf(me, o); if (p) pairs.push({ o: o, p: p }); } });
    var order = { ready: 0, gauge: 1, locked: 2 };
    pairs.sort(function (x, y) { return (order[x.p.s] ?? 3) - (order[y.p.s] ?? 3); });
    var rows = pairs.map(function (q) {
      var o = q.o, p = q.p, r = p.r, st = r >= 3 ? 'max' : p.s;
      var cls = function (k) { return k < r ? 'on' : (k === r && st === 'ready' ? 'ready' : ''); };
      var fil = function (k) { return (k < r || (k === r && st === 'ready') ? 100 : (k === r && st === 'gauge' ? p.p : 0)) + '%'; };
      var lab = function (k) { return RANKS[k] + 'ランク' + (k < r ? '：見た' : (k === r && st === 'ready' ? '：話せる' : (k === r && st === 'gauge' ? '：支援値 ' + p.p + ' / 100' : '：まだ'))); };
      var re = function (k) { return function () { if (k < r) self.launch(me, o, RANKS[k], true); }; };
      var hasImg = !!o.img;
      return {
        name: o.name, en: o.en,
        hasImg: hasImg, noImg: !hasImg, img: hasImg ? IMG[o.img].src : '', imgStyle: hasImg ? crop(o.img, 42, 42, 21, 19, 22) : '', tinyStyle: hasImg ? crop(o.img, 40, 42, 20, 19, 21) : '',
        c1: cls(0), c2: cls(1), c3: cls(2), f1: fil(0), f2: fil(1), f3: fil(2), rc1: RC[0], rc2: RC[1], rc3: RC[2], rcN: RC[Math.min(r, 2)], l1: lab(0), l2: lab(1), l3: lab(2), re1: re(0), re2: re(1), re3: re(2),
        ready: st === 'ready', gauge: st === 'gauge', locked: st === 'locked', max: st === 'max',
        pct: st === 'gauge' ? p.p : 0, pctW: (st === 'gauge' ? p.p : 0) + '%',
        nextRank: r < 3 ? RANKS[r] : 'A',
        lockText: '第' + (p.ch || 3) + '章から話せる',
        talk: function () { self.launch(me, o, RANKS[r], false); }
      };
    });
    var cards = list.map(function (o, idx) {
      var hasImg = !!o.img;
      return {
        name: o.name, no: ('0' + (idx + 1)).slice(-2), cls: idx === sel ? 'sel' : '', pressed: idx === sel ? 'true' : 'false',
        fs: o.name.length >= 6 ? '12px' : (o.name.length >= 5 ? '13px' : '16px'),
        hasImg: hasImg, noImg: !hasImg, img: hasImg ? IMG[o.img].src : '', imgStyle: hasImg ? crop(o.img, 92, 212, 48, 58, 40) : '', miniStyle: hasImg ? crop(o.img, 66, 86, 33, 32, 34) : '',
        mfs: o.name.length >= 6 ? '15px' : '17px',
        en: o.en, pc: partnersOf(o), rd: readyOf(o), rdColor: readyOf(o) > 0 ? '#f3cd78' : '#a59e90',
        hasReady: readyOf(o) > 0,
        pick: function () { if (self.rowsEl) self.rowsEl.scrollTop = 0; self.setState({ sel: idx, rs: 0 }); }
      };
    });
    var dots = function (n, cur) { var a = []; for (var i = 0; i < n; i++) a.push({ st: dot2(i === cur) }); return a; };
    var total = 0; list.forEach(function (a, i) { list.forEach(function (b, j) { if (j > i) { var p = pairOf(a, b); if (p && p.s === 'ready' && p.r < 3) total++; } }); });
    var cardsVis = Math.min(1, 850 / (list.length * 105 - 13 + 13));
    var mini = this.state.bv === 'mini';
    var rowsVis = Math.min(1, 256 / (mini ? Math.ceil(pairs.length / 2) * 58 : pairs.length * 58));
    var grid = false;
    var quiet = !!this.props.quiet;
    if (quiet) total = 0;
    var BASE = '#b9b1a1';
    var band;
    var mine = quiet ? [] : pairs.filter(function (q) { return q.p.s === 'ready' && q.p.r < 3; });
    if (mine.length) {
      var q0 = mine[0], rk = q0.p.r, col = RC[rk];
      var tail = rk === 0 ? ['の間に、絆が芽生えたようだ。', true] : (rk === 1 ? ['の絆が、深まったようだ。', false] : ['の絆が、固く結ばれようとしている。', false]);
      band = [
        { t: me.name, c: col, w: 700 }, { t: 'と', c: BASE, w: 400 }, { t: q0.o.name, c: col, w: 700 },
        { t: tail[0], c: BASE, w: 400 }
      ];
    } else if (total > 0) {
      band = [{ t: '誰かが、話したいことがあるようだ。', c: BASE, w: 400 }];
    } else {
      band = [{ t: '今は、静かな時間が流れている。', c: BASE, w: 400 }];
    }
    var go = this.state.go;
    return {
      band: band,
      totalReady: total,
      cards: cards,
      memberCount: list.length,
      ghosts: [],
      cardsScroll: cardsVis < 1,
      mvCard: !grid, mvGrid: grid, mvCardCls: grid ? '' : 'on', mvGridCls: grid ? 'on' : '', mvCardP: grid ? 'false' : 'true', mvGridP: grid ? 'true' : 'false',
      toCard: function () { self.setState({ mv: 'card', cs: 0 }); },
      toGrid: function () { self.setState({ mv: 'grid' }); },
      bvFull: !mini, bvMini: mini,
      cardThumbW: (cardsVis * 100).toFixed(2) + '%', cardThumbL: (this.state.cs * (1 - cardsVis) * 100).toFixed(2) + '%',
      cardMask: fadeMask('90deg', cardsVis < 1 && this.state.cs > 0.01, cardsVis < 1 && this.state.cs < 0.99, 36, 70),
      cardScroll: function (e) { var t = e.currentTarget; var mx = t.scrollWidth - t.clientWidth; self.setState({ cs: mx > 0 ? t.scrollLeft / mx : 0 }); },
      cardWheel: function (e) { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) e.currentTarget.scrollLeft += e.deltaY; },
      rowsScroll: rowsVis < 1,
      cardMoreCls: !grid && cardsVis < 1 && this.state.cs < 0.98 ? '' : 'off', cardMoreLabel: !grid && cardsVis < 1 && this.state.cs < 0.98 ? '右に続きがあります' : '',
      rowThumbH: (rowsVis * 100).toFixed(2) + '%', rowThumbT: (this.state.rs * (1 - rowsVis) * 100).toFixed(2) + '%',
      rowMask: fadeMask('180deg', rowsVis < 1 && this.state.rs > 0.01, rowsVis < 1 && this.state.rs < 0.99, 24, 48),
      rowScroll: function (e) { var t = e.currentTarget; self.rowsEl = t; var mx = t.scrollHeight - t.clientHeight; self.setState({ rs: mx > 0 ? t.scrollTop / mx : 0 }); },
      selOne: [{ name: me.name, count: pairs.length, moreCls: rowsVis < 1 && this.state.rs < 0.98 ? '' : 'off', moreLabel: rowsVis < 1 && this.state.rs < 0.98 ? '下に続きがあります' : '',
        fullCls: mini ? '' : 'on', miniCls: mini ? 'on' : '', fullP: mini ? 'false' : 'true', miniP: mini ? 'true' : 'false',
        toFull: function () { if (self.rowsEl) self.rowsEl.scrollTop = 0; self.setState({ bv: 'full', rs: 0 }); },
        toMini: function () { if (self.rowsEl) self.rowsEl.scrollTop = 0; self.setState({ bv: 'mini', rs: 0 }); } }],
      rows: rows,

      goOn: !!go,
      goEn: go ? ('Support ― Rank ' + go.rank) : '',
      goTitle: go ? (go.a + ' × ' + go.b) : '',
      goSub: go ? (go.replay ? '会話を見返す（既読）' : '支援会話へ ― 会話画面（支援モード）') : ''
    };
  }
}
