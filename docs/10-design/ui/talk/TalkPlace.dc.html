<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>会話枠 H 吹き出しの置き場所の調整</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Shippori+Mincho:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#e2b04a}a:hover{color:#f3cd78}
button{font-family:inherit;color:inherit}
.btn:focus-visible{outline:2px solid #f3cd78;outline-offset:3px}
.en{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase}
.t-gen{--ln:rgba(214,218,224,.72);--ln2:rgba(214,218,224,.22);--ac:#e4e7ec;--acg:rgba(214,226,240,.55);--pl:rgba(9,10,13,.92);--tx:#f1efe9;--nar:#d6d2c9}
.por{pointer-events:none;transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1),transform .35s cubic-bezier(.2,.8,.2,1)}
.por img{transition:filter .3s}
.por.zb2{z-index:2}.por.zb3{z-index:3}.por.lit{z-index:6;transform:translateY(-6px)}
.por.soft img{filter:brightness(.72) saturate(.9)}
.por.mid img{filter:brightness(.9) saturate(.96)}
.por.hide{display:none}
.dia{display:block;width:9px;height:9px;transform:rotate(45deg);background:var(--ac);box-shadow:0 0 8px var(--acg)}
.hb{transform-box:fill-box}
.hb.sw0{animation:hbA .26s cubic-bezier(.2,.8,.2,1)}
.hb.sw1{animation:hbB .26s cubic-bezier(.2,.8,.2,1)}
@keyframes hbA{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes hbB{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tab.sw0{animation:plA .24s ease-out}.tab.sw1{animation:plB .24s ease-out}
@keyframes plA{from{opacity:0}to{opacity:1}}
@keyframes plB{from{opacity:0}to{opacity:1}}
.d3{display:block;width:9px;height:9px;box-sizing:border-box;border:1px solid;transform:rotate(45deg)}
.d3.c1{border-color:#4fa3a8;background:rgba(79,163,168,.28);box-shadow:0 0 6px rgba(79,163,168,.5)}
.d3.c2{border-color:#e2b04a;background:rgba(226,176,74,.28);box-shadow:0 0 6px rgba(242,196,96,.5)}
.d3.c3{border-color:#c9cdd2;background:rgba(201,205,210,.18);box-shadow:0 0 5px rgba(214,226,240,.35)}
@media (prefers-reduced-motion: reduce){.hb,.tab{animation:none}.por{transition:none}}
.mobz{opacity:0;animation:mobIn 3.6s ease-in-out infinite}
@keyframes mobIn{0%{opacity:0;transform:translateY(5px)}18%,68%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-5px)}}
.mobh{animation:mobH .5s ease-out both}
.gyB0{animation:gyBa 4.2s ease-in-out .5s both}.gyB1{animation:gyBb 4.2s ease-in-out .5s both}
@keyframes gyBa{0%{opacity:0;transform:translateY(4px)}14%,72%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-4px)}}
@keyframes gyBb{0%{opacity:0;transform:translateY(4px)}14%,72%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-4px)}}
.gyS0{animation:gySa .38s cubic-bezier(.2,1.6,.4,1) both}.gyS1{animation:gySb .38s cubic-bezier(.2,1.6,.4,1) both}
@keyframes gySa{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes gySb{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.gyO0{animation:gyOa .45s ease-in both}.gyO1{animation:gyOb .45s ease-in both}
@keyframes gyOa{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-5px)}}
@keyframes gyOb{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-5px)}}
.gyK0{animation:gyKa .46s ease-out both}.gyK1{animation:gyKb .46s ease-out both}
@keyframes gyKa{0%{opacity:0;transform:translateX(0)}15%{opacity:1;transform:translateX(-6px)}32%{transform:translateX(6px)}50%{transform:translateX(-4px)}68%{transform:translateX(4px)}84%{transform:translateX(-2px)}100%{opacity:1;transform:translateX(0)}}
@keyframes gyKb{0%{opacity:0;transform:translateX(0)}15%{opacity:1;transform:translateX(-6px)}32%{transform:translateX(6px)}50%{transform:translateX(-4px)}68%{transform:translateX(4px)}84%{transform:translateX(-2px)}100%{opacity:1;transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){.gyK0,.gyK1{animation:none}}
.gyQ0{animation:gyQa .7s ease-out both}.gyQ1{animation:gyQb .7s ease-out both}
@keyframes gyQa{from{opacity:0;transform:translateY(5px)}to{opacity:.82;transform:translateY(0)}}
@keyframes gyQb{from{opacity:0;transform:translateY(5px)}to{opacity:.82;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.gyB0,.gyB1,.gyS0,.gyS1,.gyQ0,.gyQ1{animation:none}}
@keyframes mobH{from{opacity:0}to{opacity:1}}
.shk0{animation:shkA .36s ease-out}.shk1{animation:shkB .36s ease-out}
@keyframes shkA{0%{transform:scale(1.015) translate(0,0)}15%{transform:scale(1.015) translate(-6px,3px)}30%{transform:scale(1.015) translate(6px,-3px)}48%{transform:scale(1.015) translate(-4px,2px)}66%{transform:scale(1.015) translate(3px,-1px)}84%{transform:scale(1.015) translate(-1px,0)}100%{transform:none}}
@keyframes shkB{0%{transform:scale(1.015) translate(0,0)}15%{transform:scale(1.015) translate(-6px,3px)}30%{transform:scale(1.015) translate(6px,-3px)}48%{transform:scale(1.015) translate(-4px,2px)}66%{transform:scale(1.015) translate(3px,-1px)}84%{transform:scale(1.015) translate(-1px,0)}100%{transform:none}}
.slm0{animation:slmA .2s cubic-bezier(.2,.9,.3,1) both}.slm1{animation:slmB .2s cubic-bezier(.2,.9,.3,1) both}
@keyframes slmA{from{opacity:.2;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}
@keyframes slmB{from{opacity:.2;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}
.por.shout{transform:translateY(-12px) scale(1.04);transform-origin:50% 100%}
.shoutDim{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 70% 70% at 50% 45%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.5) 100%);animation:mobH .25s ease-out both}
@media (prefers-reduced-motion: reduce){.shk0,.shk1,.slm0,.slm1{animation:none}}
@media (prefers-reduced-motion: reduce){.mobz{animation:none;opacity:1}.mobh{animation:none}}
</style>
</helmet>
<div class="t-gen {{shkCls}}" style="position: relative; width: 1688px; height: 780px; overflow: hidden; background: #0b0b0e; font-family: 'Shippori Mincho', serif; color: #f1ead9">
  <img src="/_blob/de575dd30944303d13ab60b42a0d464e" alt="オルクス城・回廊" style="position: absolute; left: 0; top: 0; width: 1688px; height: 780px; display: block">
  <sc-if value="{{shout}}" hint-placeholder-val="{{ false }}"><div class="shoutDim" aria-hidden="true"></div></sc-if>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse 80% 78% at 50% 52%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%)"></div>
  <div class="por {{porA}}" style="position: absolute; left: {{pxA}}px; top: {{pyA}}px; width: 284px; height: 950px">
    <img src="/_blob/8c8b6c6a0ec1d8e9bbb118d2400bf24e" alt="アルシェ（13歳）" style="width: 284px; height: 950px; display: block">
  </div>
  <div class="por {{porK}}" style="position: absolute; left: {{pxK}}px; top: {{pyK}}px; width: 233px; height: 950px">
    <img src="/_blob/f33eab7e9e20acad67484fdf416a807a" alt="カリマ（13歳）" style="width: 233px; height: 950px; display: block">
  </div>
  <div class="por {{porC}}" style="position: absolute; left: {{pxC}}px; top: {{pyC}}px; width: 491px; height: 1060px">
    <img src="/_blob/fdebbf55670b101103e1d1fe80dad9d9" alt="キャリー" style="width: 491px; height: 1060px; display: block; transform: scaleX(-1)">
  </div>
  <div class="por {{porG}}" style="position: absolute; left: {{pxG}}px; top: {{pyG}}px; width: 365px; height: 1100px">
    <img src="/_blob/9fecd33be99d415e798bc2fc25f3427f" alt="ギュンター" style="width: 365px; height: 1100px; display: block; transform: scaleX(-1)">
  </div>

  <button class="btn" onClick="{{advance}}" aria-label="次の人が話す" style="position: absolute; left: 0; top: 0; width: 1688px; height: 780px; z-index: 8; padding: 0; border: 0; background: transparent; cursor: pointer"></button>

  <sc-if value="{{guides}}" hint-placeholder-val="{{ true }}">
    <svg width="1688" height="780" viewBox="0 0 1688 780" aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 10; pointer-events: none">
      <line x1="0" y1="98" x2="1688" y2="98" style="stroke: rgba(79,163,168,0.75); stroke-width: 1; stroke-dasharray: 6 6"></line>
      <line x1="0" y1="706" x2="1688" y2="706" style="stroke: rgba(79,163,168,0.75); stroke-width: 1; stroke-dasharray: 6 6"></line>
      <line x1="{{gx0}}" y1="98" x2="{{gx0}}" y2="706" style="stroke: rgba(226,176,74,0.8); stroke-width: 1; stroke-dasharray: 6 6"></line>
      <line x1="{{gx1}}" y1="98" x2="{{gx1}}" y2="706" style="stroke: rgba(226,176,74,0.8); stroke-width: 1; stroke-dasharray: 6 6"></line>
    </svg>
  </sc-if>

  <svg class="{{mainCls}}" width="1688" height="780" viewBox="0 0 1688 780" aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 11; pointer-events: none; overflow: visible; transform-origin: {{mox}}px {{moy}}px">
    <defs>
      <pattern id="pdots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1.1" style="fill: rgba(241,234,217,0.5)"></circle></pattern>
      <linearGradient id="pmg" gradientUnits="userSpaceOnUse" x1="{{mgX0}}" y1="0" x2="{{mgX1}}" y2="0"><stop offset="0" stop-color="#000"></stop><stop offset="0.45" stop-color="#262626"></stop><stop offset="1" stop-color="#fff"></stop></linearGradient>
      <mask id="pmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1688" height="780"><rect x="0" y="0" width="1688" height="780" fill="url(#pmg)"></rect></mask>
    </defs>
    <path d="{{fillD}}" style="fill: var(--pl); fill-opacity: 0.86; stroke: {{boxStroke}}; stroke-width: 1; stroke-linejoin: round"></path>
    <path d="{{fillD}}" mask="url(#pmask)" style="fill: url(#pdots); opacity: {{dotsOp}}"></path>
    <path d="{{bubD}}" style="fill: none; stroke: var(--ln); stroke-width: 1; stroke-linejoin: round; opacity: {{olOp}}"></path>
    <path d="{{hiD}}" style="fill: none; stroke: var(--ln2); stroke-width: 1"></path>
    <path d="{{burstD}}" style="fill: none; stroke: var(--ln); stroke-width: 2; stroke-linecap: round"></path>
    <line x1="{{tlX1}}" y1="{{tlY1}}" x2="{{tlX2}}" y2="{{tlY2}}" style="stroke: var(--ln); stroke-width: 1.4; opacity: {{tlOp}}"></line>
  </svg>

  <span class="dia" aria-hidden="true" style="position: absolute; left: {{cdTLx}}px; top: {{cdTLy}}px; width: 7px; height: 7px; z-index: 12; pointer-events: none"></span>
  <span class="dia" aria-hidden="true" style="position: absolute; left: {{cdBRx}}px; top: {{cdBRy}}px; width: 7px; height: 7px; z-index: 12; pointer-events: none"></span>
  <sc-if value="{{hasTip}}" hint-placeholder-val="{{ false }}">
    <span class="dia" aria-hidden="true" style="position: absolute; left: {{tipX}}px; top: {{tipY}}px; z-index: 12; pointer-events: none"></span>
  </sc-if>

  <div role="img" aria-label="プロローグ オルクス城・回廊" style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); z-index: 12; pointer-events: none; display: flex; align-items: center; justify-content: center; gap: 18px; padding: 12px 92px 14px; white-space: nowrap; height: 17px">
    <span aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; background: var(--ln); clip-path: polygon(evenodd, 0 0, 100% 0, calc(100% - 44px) 100%, 44px 100%, 0 0, 1.4px 0, 44.6px calc(100% - 1px), calc(100% - 44.6px) calc(100% - 1px), calc(100% - 1.4px) 0)"></span>
    <span aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; background: var(--pl); opacity: 0.86; clip-path: polygon(1.4px 0, calc(100% - 1.4px) 0, calc(100% - 44.6px) calc(100% - 1px), 44.6px calc(100% - 1px))"></span>
    <span class="dia" aria-hidden="true" style="position: absolute; left: 40px; bottom: -4px; width: 7px; height: 7px"></span>
    <span class="dia" aria-hidden="true" style="position: absolute; right: 40px; bottom: -4px; width: 7px; height: 7px"></span>
    <span class="en" style="font-size: 15px; font-weight: 600; letter-spacing: 0.34em; color: var(--ac)">Prologue</span>
    <span style="width: 30px; height: 1px; background: var(--ac)"></span>
    <span style="font-size: 20px; font-weight: 700; letter-spacing: 0.14em; color: #f1ead9; text-shadow: 0 1px 8px rgba(0,0,0,0.9)">オルクス城・回廊</span>
  </div>

  <sc-if value="{{hasTab}}" hint-placeholder-val="{{ true }}">
    <div class="tab {{swapCls}}" style="position: absolute; left: {{tabX}}px; top: {{tabY}}px; height: 46px; padding: 0 26px; z-index: 12; pointer-events: none; display: flex; align-items: center; gap: 10px; background: var(--pl); border: 1px solid var(--ln); box-sizing: border-box; clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%)">
      <sc-if value="{{isPhone}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="display: block; flex: none"><path d="M12 1 L14.2 9.8 L23 12 L14.2 14.2 L12 23 L9.8 14.2 L1 12 L9.8 9.8 Z" style="fill: var(--ac)"></path></svg></sc-if>
      <span style="font-size: 22px; font-weight: 700; letter-spacing: 0.14em; color: #f3f1ec; white-space: nowrap">{{name}}</span>
    </div>
  </sc-if>

  <p aria-live="polite" class="{{txCls}}" style="transform-origin: {{mtx}}px {{mty}}px; position: absolute; left: {{txX}}px; top: {{txY}}px; width: {{txW}}px; margin: 0; z-index: 12; pointer-events: none; font-size: 30px; font-weight: {{txFw}}; line-height: 50px; letter-spacing: 0.06em; white-space: pre; text-align: {{txAlign}}; color: {{txColor}}">{{shown}}</p>

  <sc-for list="{{mobs}}" as="m" hint-placeholder-count="2">
    <div class="{{m.cls}}" style="position: absolute; left: 0; top: 0; width: 1688px; height: 780px; z-index: 11; pointer-events: none; animation-delay: {{m.delay}}s">
      <svg width="1688" height="780" viewBox="0 0 1688 780" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible"><path d="{{m.d}}" style="fill: rgba(9,10,13,0.58); stroke: rgba(214,218,224,0.3); stroke-width: 1; stroke-linejoin: round"></path></svg>
      <p style="position: absolute; left: {{m.x}}px; top: {{m.y}}px; width: {{m.w}}px; margin: 0; font-size: 20px; font-weight: 600; line-height: 40px; letter-spacing: 0.08em; text-align: center; white-space: nowrap; color: #b8b5ae">{{m.t}}</p>
    </div>
  </sc-for>

  <sc-if value="{{gLs}}" hint-placeholder-val="{{ true }}">
    <svg class="{{gLc}}" width="1688" height="780" viewBox="0 0 1688 780" aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 11; pointer-events: none; overflow: visible; transform-origin: {{gLox}}px {{gLoy}}px; filter: {{gGlow}}"><path d="{{gLd}}" style="fill: {{gFill}}; stroke: {{gStroke}}; stroke-width: {{gSW}}; stroke-linejoin: round"></path><path d="{{gLd}}" style="fill: url(#pdots); opacity: {{gDots}}"></path><path d="{{gLh}}" style="fill: none; stroke: var(--ln2); stroke-width: 1"></path><path d="{{gLm}}" style="fill: var(--ac)"></path></svg>
    <p class="{{gLc}}" style="position: absolute; left: {{gLx}}px; top: {{gLy}}px; width: {{gLw}}px; margin: 0; z-index: 12; pointer-events: none; font-size: {{gFs}}px; font-weight: {{gFw}}; line-height: {{gLH}}px; letter-spacing: 0.06em; text-align: center; white-space: nowrap; color: {{gTx}}">{{gLt}}</p>
  </sc-if>
  <sc-if value="{{gRs}}" hint-placeholder-val="{{ true }}">
    <svg class="{{gRc}}" width="1688" height="780" viewBox="0 0 1688 780" aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 11; pointer-events: none; overflow: visible; transform-origin: {{gRox}}px {{gRoy}}px; filter: {{gGlow}}"><path d="{{gRd}}" style="fill: {{gFill}}; stroke: {{gStroke}}; stroke-width: {{gSW}}; stroke-linejoin: round"></path><path d="{{gRd}}" style="fill: url(#pdots); opacity: {{gDots}}"></path><path d="{{gRh}}" style="fill: none; stroke: var(--ln2); stroke-width: 1"></path><path d="{{gRm}}" style="fill: var(--ac)"></path></svg>
    <p class="{{gRc}}" style="position: absolute; left: {{gRx}}px; top: {{gRy}}px; width: {{gRw}}px; margin: 0; z-index: 12; pointer-events: none; font-size: {{gFs}}px; font-weight: {{gFw}}; line-height: {{gLH}}px; letter-spacing: 0.06em; text-align: center; white-space: nowrap; color: {{gTx}}">{{gRt}}</p>
  </sc-if>

  <div aria-hidden="true" style="position: absolute; left: {{nxX}}px; top: {{nxY}}px; z-index: 12; pointer-events: none; display: flex; align-items: center; gap: 10px; height: 20px; padding-right: 4px; transform: translateX(-100%)">
    <sc-if value="{{multi}}" hint-placeholder-val="{{ true }}"><span class="en" style="font-size: 14px; font-weight: 600; letter-spacing: 0.2em; color: #b8b5ae; margin-right: 2px">1 / 2</span></sc-if>
    <span class="d3 c1"></span><span class="d3 c2"></span><span class="d3 c3"></span>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; top: 706px; width: 1688px; height: 74px; z-index: 30; pointer-events: none; box-sizing: border-box; border-top: 1px solid rgba(255,255,255,0.08); background: linear-gradient(0deg, rgba(4,4,7,0.74), rgba(4,4,7,0.52))"></div>
  <div aria-hidden="true" style="position: absolute; left: 20px; top: 715px; z-index: 31; display: flex; gap: 10px; pointer-events: none">
    <span style="height: 56px; padding: 0 18px 0 12px; background: rgba(16,14,24,0.72); display: flex; align-items: center; gap: 10px; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1"></rect><line x1="9" y1="8" x2="15" y2="8"></line><line x1="9" y1="12" x2="15" y2="12"></line><line x1="9" y1="16" x2="13" y2="16"></line></svg>
      <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 700; letter-spacing: 0.1em; color: #f1ead9">会話ログ</span><span class="en" style="font-size: 10px; font-weight: 600; letter-spacing: 0.3em; color: #a59e90">Log</span></span>
    </span>
    <span style="height: 56px; padding: 0 18px 0 12px; background: rgba(16,14,24,0.72); display: flex; align-items: center; gap: 10px; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="7 5 18 12 7 19 7 5"></polygon></svg>
      <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 700; letter-spacing: 0.1em; color: #f1ead9">オート</span><span class="en" style="font-size: 10px; font-weight: 600; letter-spacing: 0.3em; color: #a59e90">Auto</span></span>
    </span>
    <span style="height: 56px; padding: 0 18px 0 12px; background: rgba(16,14,24,0.72); display: flex; align-items: center; gap: 10px; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 6 11 12 5 18"></polyline><polyline points="12 6 18 12 12 18"></polyline></svg>
      <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 700; letter-spacing: 0.1em; color: #f1ead9">スキップ</span><span class="en" style="font-size: 10px; font-weight: 600; letter-spacing: 0.3em; color: #a59e90">Skip</span></span>
    </span>
  </div>

  <sc-if value="{{guides}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; right: 24px; top: 716px; height: 54px; z-index: 32; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 4px; font-family: 'Shippori Mincho', serif; white-space: nowrap">
      <span style="font-size: 17px; font-weight: 600; letter-spacing: 0.06em; color: #f1ead9">{{info1}}</span>
      <span style="font-size: 15px; font-weight: 600; letter-spacing: 0.06em; color: {{info2Color}}">{{info2}}</span>
    </div>
  </sc-if>
