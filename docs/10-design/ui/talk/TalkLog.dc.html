<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>会話ログ画面（H案）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Shippori+Mincho:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#e2b04a}a:hover{color:#f3cd78}
button{font-family:inherit;color:inherit}
.btn:focus-visible{outline:2px solid #f3cd78;outline-offset:3px}
.en{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase}
.t-gen{--ln:rgba(214,218,224,.72);--ln2:rgba(214,218,224,.22);--ac:#e4e7ec;--acg:rgba(214,226,240,.55);--pn:rgba(9,10,13,.74);--pl:rgba(9,10,13,.92);--nm:#f5f3ee;--tx:#f1efe9;--nar:#d6d2c9;--sub:#b8b5ae}
.t-orc{--ln:rgba(201,205,210,.75);--ln2:rgba(201,205,210,.25);--ac:#e2b04a;--acg:rgba(242,196,96,.55);--pn:rgba(12,10,20,.74);--pl:rgba(12,10,20,.92);--nm:#fbf5e7;--tx:#f1ead9;--nar:#d9d0bd;--sub:#b9b1a1}
.por{z-index:2;pointer-events:none;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.por.lit{z-index:6}
.por img{transition:filter .3s}
.por.dim img{filter:brightness(.5) saturate(.85)}
.por.lit{transform:translateY(-6px)}
.dia{display:block;width:9px;height:9px;transform:rotate(45deg);background:var(--ac);box-shadow:0 0 8px var(--acg)}
.dia.hollow{background:transparent;border:1px solid var(--ac);box-shadow:none;box-sizing:border-box}
.box{animation:boxIn .34s cubic-bezier(.2,.8,.2,1);transition:left .32s cubic-bezier(.2,.8,.2,1)}
@keyframes boxIn{from{clip-path:inset(0 50% 0 50%);opacity:.2}to{clip-path:inset(-20px -20px -20px -20px);opacity:1}}
.band{animation:bandIn .34s ease-out}
@keyframes bandIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.plate{transition:left .3s cubic-bezier(.2,.8,.2,1),top .3s}
.plate.sw0{animation:plA .26s cubic-bezier(.2,.8,.2,1)}
.plate.sw1{animation:plB .26s cubic-bezier(.2,.8,.2,1)}
@keyframes plA{from{opacity:0;transform:translateX(var(--from))}to{opacity:1;transform:translateX(0)}}
@keyframes plB{from{opacity:0;transform:translateX(var(--from))}to{opacity:1;transform:translateX(0)}}
.ptr{transition:left .3s cubic-bezier(.2,.8,.2,1),top .3s}
.ptr .dia{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 6px var(--acg)}50%{box-shadow:0 0 14px var(--acg)}}
.ptr .dia.hollow{animation:none}
.nx{animation:nxIn .2s ease-out}
.nx .chev{animation:bob 1.1s ease-in-out infinite}
@keyframes nxIn{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.dots{background-image:radial-gradient(circle,rgba(241,234,217,.5) 1.1px,transparent 1.6px);background-size:16px 16px;opacity:.5;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.15) 35%,#000 85%);mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.15) 35%,#000 85%)}
.bar-t{animation:barT .45s cubic-bezier(.2,.8,.2,1)}
.bar-b{animation:barB .45s cubic-bezier(.2,.8,.2,1)}
@keyframes barT{from{transform:translateY(-48px)}to{transform:translateY(0)}}
@keyframes barB{from{transform:translateY(48px)}to{transform:translateY(0)}}
.logbtn{transition:color .2s}
.logbtn:hover{color:#fbf5e7}
.lg{animation:nxIn .25s ease-out}
.lg-list{-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0,#000 90px);mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0,#000 90px)}
.star-btn .star{transition:transform .5s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(242,196,96,.5))}
.star-btn:hover .star{transform:rotate(45deg) scale(1.12)}
@media (prefers-reduced-motion: reduce){.box,.band,.plate,.nx .chev,.ptr .dia,.bar-t,.bar-b{animation:none}}
.por.zb2{z-index:2}.por.zb3{z-index:3}.por.lit{z-index:6}
.por.soft img{filter:brightness(.72) saturate(.9)}
.hb{transform-box:fill-box}
.hb.sw0{animation:hbA .26s cubic-bezier(.2,.8,.2,1)}
.hb.sw1{animation:hbB .26s cubic-bezier(.2,.8,.2,1)}
@keyframes hbA{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes hbB{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tab{transition:left .25s cubic-bezier(.2,.8,.2,1)}
.tab.sw0{animation:plA .24s ease-out}.tab.sw1{animation:plB .24s ease-out}
.nxh{animation:nxIn .2s ease-out}
.nxh .chev{animation:bob 1.1s ease-in-out infinite}
.lgstrip button{transition:color .2s}
.logon .hb,.logon .tab,.logon p[aria-live],.logon .nxh,.logon .tdots,.logon .ui-hide{visibility:hidden}
.lgnode{position:absolute;left:-40px;top:7px;width:7px;height:7px;transform:rotate(45deg);box-sizing:border-box;border:1px solid var(--ln);background:var(--pl)}
.lgnode.cur{left:-41px;top:6px;width:9px;height:9px;border-color:var(--ac);background:var(--ac);box-shadow:0 0 10px var(--acg)}
.lgnode.narr{border-color:var(--ln2)}
.rk{display:block;width:10px;height:10px;transform:rotate(45deg);box-sizing:border-box;border:1px solid var(--ac)}
.rk.on{background:var(--ac);box-shadow:0 0 8px var(--acg)}
.rk.now{background:var(--ac);box-shadow:0 0 14px var(--acg);animation:pulse 2.4s ease-in-out infinite}
.por.hide{display:none}
.por{transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1),transform .35s cubic-bezier(.2,.8,.2,1)}
.star-btn .star{transition:transform .5s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(242,196,96,.5))}
.star-btn:hover .star{transform:rotate(45deg) scale(1.12)}
.d3{display:block;width:9px;height:9px;box-sizing:border-box;border:1px solid;transform:rotate(45deg);animation:hop3 3.6s cubic-bezier(.3,.7,.3,1) infinite,col3 9s linear infinite,morph3 .55s cubic-bezier(.2,.8,.2,1) both}
.m3{display:block;width:9px;height:9px;position:relative}
.m3:nth-child(2) .d3{animation-delay:.22s,-6s,.12s}.m3:nth-child(3) .d3{animation-delay:.44s,-3s,.24s}
@keyframes morph3{0%{width:5px;height:5px;margin:2px;border-radius:50%;border-color:#8d8a84;background:#8d8a84;box-shadow:none}55%{width:5px;height:5px;margin:2px;border-radius:50%}100%{width:9px;height:9px;margin:0;border-radius:0}}
.tdots{display:flex;align-items:center;gap:12px;height:20px;padding-right:6px}
.tdots span{display:block;width:5px;height:5px;border-radius:50%;background:rgba(200,198,192,.55);animation:tdot 1.4s ease-in-out infinite}
.tdots span:nth-child(2){animation-delay:.2s}.tdots span:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes hop3{0%,16%,100%{transform:translateY(0) rotate(45deg)}6%{transform:translateY(-6px) rotate(45deg)}11%{transform:translateY(0) rotate(45deg)}}
@keyframes col3{0%,100%{border-color:#4fa3a8;background:rgba(79,163,168,.28);box-shadow:0 0 6px rgba(79,163,168,.5)}33.3%{border-color:#e2b04a;background:rgba(226,176,74,.28);box-shadow:0 0 6px rgba(242,196,96,.5)}66.6%{border-color:#c9cdd2;background:rgba(201,205,210,.18);box-shadow:0 0 5px rgba(214,226,240,.35)}}
@media (prefers-reduced-motion: reduce){.d3{animation:none}.d3:nth-child(1){border-color:#4fa3a8;background:rgba(79,163,168,.25)}.d3:nth-child(2){border-color:#e2b04a;background:rgba(226,176,74,.25)}.d3:nth-child(3){border-color:#c9cdd2}}
.tile{transition:background .2s}.tile:hover{background:rgba(34,31,44,.94)}.lgstrip button:hover{color:#fbf5e7}
</style>
</helmet>
<div class="{{rootCls}}" style="position: relative; width: 1688px; height: 780px; overflow: hidden; background: #0b0b0e; font-family: 'Shippori Mincho', serif; color: #f1ead9">
  <img src="/_blob/de575dd30944303d13ab60b42a0d464e" alt="オルクス城・回廊" style="position: absolute; left: 0; top: 0; width: 1688px; height: 780px; display: block">
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse 80% 78% at 50% 52%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%)"></div>
  <div class="por {{porL1}}" style="position: absolute; left: {{pxL1}}px; top: {{pyL1}}px; width: 284px; height: 950px">
    <img src="/_blob/8c8b6c6a0ec1d8e9bbb118d2400bf24e" alt="アルシェ（13歳）" style="width: 284px; height: 950px; display: block;">
  </div>
  <div class="por {{porL2}}" style="position: absolute; left: {{pxL2}}px; top: {{pyL2}}px; width: 233px; height: 950px">
    <img src="/_blob/f33eab7e9e20acad67484fdf416a807a" alt="カリマ（13歳）" style="width: 233px; height: 950px; display: block;">
  </div>
  <div class="por {{porR2}}" style="position: absolute; left: {{pxR2}}px; top: {{pyR2}}px; width: 491px; height: 1060px">
    <img src="/_blob/fdebbf55670b101103e1d1fe80dad9d9" alt="キャリー" style="width: 491px; height: 1060px; display: block; transform: scaleX(-1);">
  </div>
  <div class="por {{porR1}}" style="position: absolute; left: {{pxR1}}px; top: {{pyR1}}px; width: 365px; height: 1100px">
    <img src="/_blob/9fecd33be99d415e798bc2fc25f3427f" alt="ギュンター" style="width: 365px; height: 1100px; display: block; transform: scaleX(-1);">
  </div>

  <button class="btn adv" onClick="{{advance}}" aria-label="次へ進む" style="position: absolute; left: 0; top: 0; width: 1688px; height: 780px; z-index: 8; padding: 0; border: 0; background: transparent; cursor: pointer"></button>

  <svg class="hb {{swapCls}}" width="1688" height="780" viewBox="0 0 1688 780" aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 11; pointer-events: none; overflow: visible">
    <defs>
      <linearGradient id="hfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(46,46,52)"></stop><stop offset="1" stop-color="rgb(26,26,30)"></stop></linearGradient>
      <pattern id="hdots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1.1" style="fill: rgba(241,234,217,0.5)"></circle></pattern>
      <linearGradient id="hmg" gradientUnits="userSpaceOnUse" x1="{{mgX0}}" y1="0" x2="{{mgX1}}" y2="0"><stop offset="0" stop-color="#000"></stop><stop offset="0.45" stop-color="#262626"></stop><stop offset="1" stop-color="#fff"></stop></linearGradient>
      <mask id="hmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1688" height="780"><rect x="0" y="0" width="1688" height="780" fill="url(#hmg)"></rect></mask>
    </defs>
    <path d="{{bubD}}" style="fill: {{bubFill}}; fill-opacity: {{bubOp}}; stroke: {{bubStroke}}; stroke-width: 1; stroke-linejoin: round"></path>
    <path d="{{bubD}}" mask="url(#hmask)" style="fill: url(#hdots); opacity: {{dotsOp}}"></path>
    <path d="{{hiD}}" style="fill: none; stroke: {{hiStroke}}; stroke-width: 1"></path>
  </svg>

  <sc-if value="{{hub}}" hint-placeholder-val="{{ true }}">
    <span class="dia ui-hide" aria-hidden="true" style="position: absolute; left: {{cdTLx}}px; top: {{cdTLy}}px; width: 7px; height: 7px; z-index: 12; pointer-events: none"></span>
    <span class="dia ui-hide" aria-hidden="true" style="position: absolute; left: {{cdBRx}}px; top: {{cdBRy}}px; width: 7px; height: 7px; z-index: 12; pointer-events: none"></span>
    <sc-if value="{{hasTip}}" hint-placeholder-val="{{ true }}">
      <span class="dia {{tabDia}}" aria-hidden="true" style="position: absolute; left: {{tipX}}px; top: {{tipY}}px; z-index: 12; pointer-events: none"></span>
    </sc-if>
    <div class="ui-hide" role="img" aria-label="{{ctxLabel}}" style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); z-index: 12; pointer-events: none; display: flex; align-items: center; justify-content: center; gap: 18px; padding: 12px 92px 14px; white-space: nowrap; height: 17px">
      <span aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; background: var(--ln); clip-path: polygon(evenodd, 0 0, 100% 0, calc(100% - 44px) 100%, 44px 100%, 0 0, 1.4px 0, 44.6px calc(100% - 1px), calc(100% - 44.6px) calc(100% - 1px), calc(100% - 1.4px) 0)"></span>
      <span aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; background: var(--pl); opacity: 0.86; clip-path: polygon(1.4px 0, calc(100% - 1.4px) 0, calc(100% - 44.6px) calc(100% - 1px), 44.6px calc(100% - 1px))"></span>
      <span class="dia" aria-hidden="true" style="position: absolute; left: 40px; bottom: -4px; width: 7px; height: 7px"></span>
      <span class="dia" aria-hidden="true" style="position: absolute; right: 40px; bottom: -4px; width: 7px; height: 7px"></span>
      <sc-if value="{{isSupport}}" hint-placeholder-val="{{ false }}">
        <span class="en" style="font-size: 15px; font-weight: 600; letter-spacing: 0.34em; color: var(--ac)">Support</span>
        <span style="width: 30px; height: 1px; background: var(--ac)"></span>
        <span style="display: flex; align-items: center; gap: 16px">
          <span style="display: flex; align-items: center; gap: 8px"><span class="en" style="font-size: 16px; font-weight: 600; color: #a59e90">C</span><span class="rk on"></span></span>
          <span style="display: flex; align-items: center; gap: 8px"><span class="en" style="font-size: 16px; font-weight: 700; color: #fbf5e7">B</span><span class="rk now"></span></span>
          <span style="display: flex; align-items: center; gap: 8px"><span class="en" style="font-size: 16px; font-weight: 600; color: #a59e90">A</span><span class="rk"></span></span>
        </span>
        <span style="width: 1px; height: 18px; background: var(--ln2)"></span>
        <span style="font-size: 20px; font-weight: 700; letter-spacing: 0.14em; color: #f1ead9; text-shadow: 0 1px 8px rgba(0,0,0,0.9)">三百本の素振り</span>
      </sc-if>
      <sc-if value="{{notSupport}}" hint-placeholder-val="{{ true }}">
        <span class="en" style="font-size: 15px; font-weight: 600; letter-spacing: 0.34em; color: var(--ac)">Prologue</span>
        <span style="width: 30px; height: 1px; background: var(--ac)"></span>
        <span style="font-size: 20px; font-weight: 700; letter-spacing: 0.14em; color: #f1ead9; text-shadow: 0 1px 8px rgba(0,0,0,0.9)">オルクス城・回廊</span>
      </sc-if>
    </div>
    <header style="position: absolute; left: 40px; top: 26px; z-index: 12; pointer-events: none; display: {{hdrDisp}}; align-items: center; gap: 14px">
      <span class="en" style="font-size: 14px; font-weight: 600; letter-spacing: 0.34em; color: var(--ac)">Prologue</span>
      <span style="width: 30px; height: 1px; background: var(--ac)"></span>
      <span style="font-size: 16px; font-weight: 600; letter-spacing: 0.12em; color: #d8d2c4; text-shadow: 0 1px 6px rgba(0,0,0,0.9)">オルクス城・回廊</span>
    </header>
  </sc-if>

  <sc-if value="{{hasTab}}" hint-placeholder-val="{{ true }}">
    <div class="tab {{swapCls}}" style="position: absolute; left: {{tabX}}px; top: {{tabY}}px; height: 46px; padding: 0 26px; z-index: 12; pointer-events: none; display: flex; align-items: center; gap: 10px; border-radius: {{tabRadius}}; background: {{tabBg}}; border: 1px solid {{tabBorder}}; box-sizing: border-box; clip-path: {{tabClip}}; --from: 0px">
      <sc-if value="{{isPhone}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="display: block; flex: none"><path d="M12 1 L14.2 9.8 L23 12 L14.2 14.2 L12 23 L9.8 14.2 L1 12 L9.8 9.8 Z" style="fill: var(--ac)"></path></svg></sc-if>
      <span style="font-size: 22px; font-weight: 700; letter-spacing: 0.14em; color: #f3f1ec; white-space: nowrap">{{name}}</span>
    </div>
  </sc-if>

  <p aria-live="polite" style="position: absolute; left: {{txX}}px; top: {{txY}}px; width: {{txW}}px; margin: 0; z-index: 12; pointer-events: none; font-size: 30px; font-weight: 600; line-height: 50px; letter-spacing: 0.06em; white-space: pre; text-align: {{txAlign}}; color: {{txColor}}">{{shown}}</p>

  <sc-if value="{{typing}}" hint-placeholder-val="{{ false }}">
    <div class="tdots" aria-hidden="true" style="position: absolute; left: {{nxX}}px; top: {{nxY}}px; z-index: 12; pointer-events: none; transform: translateX(-100%)"><span></span><span></span><span></span></div>
  </sc-if>
  <sc-if value="{{done}}" hint-placeholder-val="{{ true }}">
    <div class="nxh" aria-hidden="true" style="position: absolute; left: {{nxX}}px; top: {{nxY}}px; z-index: 12; pointer-events: none; display: flex; align-items: center; gap: 12px; transform: {{nxT}}">
      <sc-if value="{{multi}}" hint-placeholder-val="{{ false }}">
        <span class="en" style="font-size: 14px; font-weight: 600; letter-spacing: 0.2em; color: #b8b5ae">{{pageTxt}}</span>
      </sc-if>
      <sc-if value="{{hub}}" hint-placeholder-val="{{ true }}">
        <span class="pg3" style="display: flex; align-items: center; gap: 10px; height: 20px; padding-right: 4px"><span class="m3"><span class="d3"></span></span><span class="m3"><span class="d3"></span></span><span class="m3"><span class="d3"></span></span></span>
      </sc-if>
      <sc-if value="{{soft}}" hint-placeholder-val="{{ false }}">
        <span class="chev" style="display: block; width: 16px; height: 12px"><svg width="16" height="12" viewBox="0 0 16 12" style="display: block"><polygon points="1 1 15 1 8 11" style="fill: #e6e3dc"></polygon></svg></span>
      </sc-if>
    </div>
  </sc-if>

  <div class="ui-hide" aria-hidden="true" style="position: absolute; left: 0; top: 706px; width: 1688px; height: 74px; z-index: 30; pointer-events: none; box-sizing: border-box; border-top: 1px solid rgba(255,255,255,0.08); background: linear-gradient(0deg, rgba(4,4,7,0.74), rgba(4,4,7,0.52))"></div>
  <sc-if value="{{soft}}" hint-placeholder-val="{{ false }}">
  <div class="lgstrip ui-hide" style="position: absolute; left: 0; top: 716px; width: 760px; height: 52px; z-index: 31; display: flex; align-items: center; gap: 6px; padding-left: 64px; box-sizing: border-box; background: linear-gradient(90deg, rgba(8,8,10,0.82) 0%, rgba(8,8,10,0.6) 55%, rgba(8,8,10,0) 100%)">
    <button class="btn" onClick="{{openLog}}" aria-label="会話ログを開く" style="height: 52px; padding: 0 16px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; gap: 10px; color: #d8d4cb">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1"></rect><line x1="9" y1="8" x2="15" y2="8"></line><line x1="9" y1="12" x2="15" y2="12"></line><line x1="9" y1="16" x2="13" y2="16"></line></svg>
      <span style="font-size: 18px; font-weight: 600; letter-spacing: 0.12em">会話ログ</span>
    </button>
    <button class="btn" aria-label="オート（自動送り）" style="height: 52px; padding: 0 16px; border: 0; background: transparent; cursor: pointer; color: #b8b5ae"><span style="font-size: 18px; font-weight: 600; letter-spacing: 0.12em">オート</span></button>
    <button class="btn" aria-label="スキップ" style="height: 52px; padding: 0 16px; border: 0; background: transparent; cursor: pointer; color: #b8b5ae"><span style="font-size: 18px; font-weight: 600; letter-spacing: 0.12em">スキップ</span></button>
  </div>

  </sc-if>
  <sc-if value="{{hub}}" hint-placeholder-val="{{ true }}">
  <div class="ui-hide" style="position: absolute; left: 20px; top: 715px; z-index: 31; display: flex; gap: 10px">
    <button class="btn tile" onClick="{{openLog}}" aria-label="会話ログを開く" style="height: 56px; padding: 0 18px 0 12px; border: 0; background: rgba(16,14,24,0.72); cursor: pointer; display: flex; align-items: center; gap: 10px; text-align: left; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1"></rect><line x1="9" y1="8" x2="15" y2="8"></line><line x1="9" y1="12" x2="15" y2="12"></line><line x1="9" y1="16" x2="13" y2="16"></line></svg>
      <span style="display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 16px; font-weight: 700; letter-spacing: 0.1em; color: #f1ead9">会話ログ</span>
        <span class="en" style="font-size: 10px; font-weight: 600; letter-spacing: 0.3em; color: #a59e90">Log</span>

      hiStroke: hub ? 'var(--ln2)' : 'rgba(255,255,255,0.08)',
      bubFill: hub ? 'var(--pl)' : 'url(#hfill)',
      bubStroke: hub ? 'var(--ln)' : 'rgba(255,255,255,0.16)',
      bubOp: hub ? 0.86 : (isNarr ? 0.62 : 0.9),
      dotsOp: isPhone ? 0.55 : (hub && !isNarr ? 0.3 : 0),
      mgX0: x0, mgX1: x1,
      cdTLx: x0 + 10, cdTLy: y0 - 4, cdBRx: x1 - 17, cdBRy: y1 - 4,
      hasTip: false, tipX: tail ? tail.tx - 5 : 0, tipY: tail ? tail.ty - 5 : 0,
      nDL: x0 + 36, nDR: x1 - 45, nDY: y0 + h / 2 - 5,
      tabRadius: hub ? '0' : '16px 16px 6px 6px',
      tabBg: hub ? 'var(--pl)' : 'linear-gradient(180deg, rgba(86,86,94,0.97), rgba(62,62,70,0.97))',
      tabBorder: hub ? 'var(--ln)' : 'rgba(255,255,255,0.14)',
      tabClip: hub ? 'polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%)' : 'none',
      hasTab: !isNarr, name: name, isPhone: isPhone,
      tabX: tabX, tabY: y0 - 30, tabDia: isVoice ? 'hollow' : '',
      txX: isNarr ? x0 + 30 : cx - txW / 2, txY: y0 + (isNarr ? 30 : 34), txW: isNarr ? w - 60 : txW,
      txAlign: isNarr ? 'center' : 'left',
      txColor: isNarr ? '#d6d2c9' : '#f1efe9',
      shown: page.slice(0, c.n), done: c.n >= page.length, typing: hub && c.n < page.length,
      multi: L.pages.length > 1, pageTxt: (c.p + 1) + ' / ' + L.pages.length,
      nxX: hub ? x1 - 30 : cx, nxY: hub ? y1 - 32 : y1 - 26,
      nxT: hub ? 'translateX(-100%)' : 'translateX(-50%)'
    };
  }
}
</script>
