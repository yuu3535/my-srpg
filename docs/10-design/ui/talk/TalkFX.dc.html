<style>
body{margin:0}
a{color:#e2b04a}a:hover{color:#f3cd78}
button{font-family:inherit;color:inherit}
.btn:focus-visible{outline:2px solid #f3cd78;outline-offset:3px}
.en{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase}
.t-gen{--ln:rgba(214,218,224,.72);--ln2:rgba(214,218,224,.22);--ac:#e4e7ec;--acg:rgba(214,226,240,.55);--pn:rgba(9,10,13,.74);--pl:rgba(9,10,13,.92);--nm:#f5f3ee;--tx:#f1efe9;--nar:#d6d2c9;--sub:#b8b5ae}
.t-orc{--ln:rgba(201,205,210,.75);--ln2:rgba(201,205,210,.25);--ac:#e2b04a;--acg:rgba(242,196,96,.55);--pn:rgba(12,10,20,.74);--pl:rgba(12,10,20,.92);--nm:#fbf5e7;--tx:#f1ead9;--nar:#d9d0bd;--sub:#b9b1a1}
.por{z-index:2;pointer-events:none;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.por.lit{z-index:6}
.por img{transition:filter .3s}
.por.dim img{filter:brightness(.5) saturate(.85)}
.por.lit{transform:translateY(-6px)}
.dia{display:block;width:9px;height:9px;transform:rotate(45deg);background:var(--ac);box-shadow:0 0 8px var(--acg)}
.dia.hollow{background:transparent;border:1px solid var(--ac);box-shadow:none;box-sizing:border-box}
.box{animation:boxIn .34s cubic-bezier(.2,.8,.2,1);transition:left .32s cubic-bezier(.2,.8,.2,1)}
@keyframes boxIn{from{clip-path:inset(0 50% 0 50%);opacity:.2}to{clip-path:inset(-20px -20px -20px -20px);opacity:1}}
.band{animation:bandIn .34s ease-out}
@keyframes bandIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.plate{transition:left .3s cubic-bezier(.2,.8,.2,1),top .3s}
.plate.sw0{animation:plA .26s cubic-bezier(.2,.8,.2,1)}
.plate.sw1{animation:plB .26s cubic-bezier(.2,.8,.2,1)}
@keyframes plA{from{opacity:0;transform:translateX(var(--from))}to{opacity:1;transform:translateX(0)}}
@keyframes plB{from{opacity:0;transform:translateX(var(--from))}to{opacity:1;transform:translateX(0)}}
.ptr{transition:left .3s cubic-bezier(.2,.8,.2,1),top .3s}
.ptr .dia{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 6px var(--acg)}50%{box-shadow:0 0 14px var(--acg)}}
.ptr .dia.hollow{animation:none}
.nx{animation:nxIn .2s ease-out}
.nx .chev{animation:bob 1.1s ease-in-out infinite}
@keyframes nxIn{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.dots{background-image:radial-gradient(circle,rgba(241,234,217,.5) 1.1px,transparent 1.6px);background-size:16px 16px;opacity:.5;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.15) 35%,#000 85%);mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.15) 35%,#000 85%)}
.bar-t{animation:barT .45s cubic-bezier(.2,.8,.2,1)}
.bar-b{animation:barB .45s cubic-bezier(.2,.8,.2,1)}
@keyframes barT{from{transform:translateY(-48px)}to{transform:translateY(0)}}
@keyframes barB{from{transform:translateY(48px)}to{transform:translateY(0)}}
.logbtn{transition:color .2s}
.logbtn:hover{color:#fbf5e7}
.lg{animation:nxIn .25s ease-out}
.lg-list{-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0,#000 90px);mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0,#000 90px)}
.star-btn .star{transition:transform .5s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(242,196,96,.5))}
.star-btn:hover .star{transform:rotate(45deg) scale(1.12)}
@media (prefers-reduced-motion: reduce){.box,.band,.plate,.nx .chev,.ptr .dia,.bar-t,.bar-b{animation:none}}
.por.zb2{z-index:2}.por.zb3{z-index:3}.por.lit{z-index:6}
.por.soft img{filter:brightness(.72) saturate(.9)}
.hb{transform-box:fill-box}
.hb.sw0{animation:hbA .26s cubic-bezier(.2,.8,.2,1)}
.hb.sw1{animation:hbB .26s cubic-bezier(.2,.8,.2,1)}
@keyframes hbA{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes hbB{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tab{transition:left .25s cubic-bezier(.2,.8,.2,1)}
.tab.sw0{animation:plA .24s ease-out}.tab.sw1{animation:plB .24s ease-out}
.nxh{animation:nxIn .2s ease-out}
.nxh .chev{animation:bob 1.1s ease-in-out infinite}
.lgstrip button{transition:color .2s}
.rk{display:block;width:10px;height:10px;transform:rotate(45deg);box-sizing:border-box;border:1px solid var(--ac)}
.rk.on{background:var(--ac);box-shadow:0 0 8px var(--acg)}
.rk.now{background:var(--ac);box-shadow:0 0 14px var(--acg);animation:pulse 2.4s ease-in-out infinite}
.por.hide{display:none}
.por{transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1),transform .35s cubic-bezier(.2,.8,.2,1)}
.star-btn .star{transition:transform .5s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(242,196,96,.5))}
.star-btn:hover .star{transform:rotate(45deg) scale(1.12)}
.d3{display:block;width:9px;height:9px;box-sizing:border-box;border:1px solid;transform:rotate(45deg);animation:hop3 3.6s cubic-bezier(.3,.7,.3,1) infinite,col3 9s linear infinite,morph3 .55s cubic-bezier(.2,.8,.2,1) both}
.m3{display:block;width:9px;height:9px;position:relative}
.m3:nth-child(2) .d3{animation-delay:.22s,-6s,.12s}.m3:nth-child(3) .d3{animation-delay:.44s,-3s,.24s}
@keyframes morph3{0%{width:5px;height:5px;margin:2px;border-radius:50%;border-color:#8d8a84;background:#8d8a84;box-shadow:none}55%{width:5px;height:5px;margin:2px;border-radius:50%}100%{width:9px;height:9px;margin:0;border-radius:0}}
.tdots{display:flex;align-items:center;gap:12px;height:20px;padding-right:6px}
.tdots span{display:block;width:5px;height:5px;border-radius:50%;background:rgba(200,198,192,.55);animation:tdot 1.4s ease-in-out infinite}
.tdots span:nth-child(2){animation-delay:.2s}.tdots span:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes hop3{0%,16%,100%{transform:translateY(0) rotate(45deg)}6%{transform:translateY(-6px) rotate(45deg)}11%{transform:translateY(0) rotate(45deg)}}
@keyframes col3{0%,100%{border-color:#4fa3a8;background:rgba(79,163,168,.28);box-shadow:0 0 6px rgba(79,163,168,.5)}33.3%{border-color:#e2b04a;background:rgba(226,176,74,.28);box-shadow:0 0 6px rgba(242,196,96,.5)}66.6%{border-color:#c9cdd2;background:rgba(201,205,210,.18);box-shadow:0 0 5px rgba(214,226,240,.35)}}
@media (prefers-reduced-motion: reduce){.d3{animation:none}.d3:nth-child(1){border-color:#4fa3a8;background:rgba(79,163,168,.25)}.d3:nth-child(2){border-color:#e2b04a;background:rgba(226,176,74,.25)}.d3:nth-child(3){border-color:#c9cdd2}}
.tile{transition:background .2s}.tile:hover{background:rgba(34,31,44,.94)}.lgstrip button:hover{color:#fbf5e7}
.fxshake{animation:fxshake .42s cubic-bezier(.36,.07,.19,.97) .05s both}
@keyframes fxshake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.crk{stroke-dasharray:1;stroke-dashoffset:1;animation:crk .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes crk{to{stroke-dashoffset:0}}
.shard{transform-box:view-box;animation:fall 1s cubic-bezier(.5,0,.75,0) forwards}
@keyframes fall{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.gone{animation:gone .2s linear forwards}
@keyframes gone{to{opacity:0}}
.redin{opacity:0;animation:redin .7s cubic-bezier(.2,.8,.2,1) forwards}
.redburst{opacity:0;animation:redburst .9s cubic-bezier(.2,1.4,.3,1) .86s forwards}
@keyframes redburst{0%{opacity:1;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
@keyframes redpulse{0%,100%{filter:drop-shadow(0 0 0 rgba(255,40,40,0))}50%{filter:drop-shadow(0 0 14px rgba(255,40,40,.55))}}
@keyframes redin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.flash{opacity:0;animation:flash .5s ease-out forwards}
@keyframes flash{0%{opacity:0}15%{opacity:.55}100%{opacity:0}}
.stain{transform:translateY(-440px);animation:stain 3.4s cubic-bezier(.45,0,.25,1) .4s forwards}
@keyframes stain{to{transform:translateY(0)}}
.stxt{animation:stxt 2.6s ease-in .9s forwards}
@keyframes stxt{to{color:#f0b8c6;text-shadow:0 0 10px rgba(160,20,60,.6)}}
.stab{animation:stab 1.6s ease-in 2s forwards}
@keyframes stab{to{background:rgba(58,8,26,.96);border-color:rgba(214,70,110,.9)}}
.fxtxt-crack{animation:txj .42s steps(2) .05s}
@keyframes txj{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,0)}}
.fxtxt-gone{animation:gone .25s linear .7s forwards}
@media (prefers-reduced-motion: reduce){.fxshake,.fxtxt-crack{animation:none}.crk{stroke-dashoffset:0;animation:none}}
</style>
