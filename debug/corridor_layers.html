<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>横スクロールの重ね方（デバッグ）</title>
<!--
  探索の2D横スクロール（オルクス城の回廊）の層の重ね方を、原作者がつまみで決めるデバッグ用ページ（総合担当 2026-10-03）。
  静的サーバー（リポジトリのルート）で開く: http://localhost:8931/debug/corridor_layers.html
  素材のフォルダの一覧はサーバーのフォルダ一覧から読む。決めた値は「コピー」で総合担当へ渡し、Unity の回廊に使う。
  座標はゲームの基準画面 844×390（左上が 0,0）。速さは 1 でカメラと同じ（手前）、0 で動かない（空）。
-->
<style>
  :root { color-scheme: dark; --ink: #0d1923; --panel: #142430; --line: #3a4b56; --text: #e8ece9; --muted: #9fb0b6; --teal: #67bfc1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--text); font: 13px/1.5 "Yu Gothic UI", "Meiryo", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-family: "Yu Mincho", serif; }
  header input[type=text] { width: 360px; }
  input, select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; }
  button { cursor: pointer; } button:hover { border-color: var(--teal); }
  main { display: grid; grid-template-columns: max-content 430px; gap: 12px; padding: 12px 14px; }
  #wrap { overflow: hidden; }
  #wrap { position: relative; }
  #stage { position: relative; width: 844px; height: 390px; overflow: hidden; background: #000; transform-origin: top left; }
  #stage .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; isolation: isolate; }   /* 「手前」の重なりを層の中だけにする（アルシェより前に出さない） */
  #stage img { position: absolute; display: block; user-select: none; }
  #stage .floorRow { position: absolute; background-repeat: repeat-x; }
  #stage .shade { position: absolute; left: 0; right: 0; }
  #hero { position: absolute; pointer-events: none; }
  #world { position: absolute; inset: 0; transform-origin: 422px 195px; }   /* この場面のカメラ（引き・寄り・ずらし） */
  #stage .band { position: absolute; left: 0; right: 0; height: 30px; background: rgb(9,10,13); pointer-events: none; }
  #camBar { border-top: 1px dashed #2a3a44; padding-top: 8px; }
  #camBar b { font-weight: 600; }
  #feet { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed rgba(103,191,193,.8); pointer-events: none; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
  .bar label { display: flex; align-items: center; gap: 6px; }
  #layers { display: grid; gap: 8px; max-height: calc(100vh - 120px); overflow-y: auto; padding-right: 4px; }
  .card { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; background: #11202a; }
  .card.off { opacity: .55; }
  .card .head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .card .head b { flex: 1; font-weight: 600; }
  .card .head button { padding: 0 6px; }
  .row { display: grid; grid-template-columns: 70px 1fr 54px; align-items: center; gap: 6px; }
  .row input[type=range] { width: 100%; }
  .row input[type=number] { width: 54px; padding: 1px 3px; }
  .card select { width: 100%; margin-bottom: 4px; }
  .modRow { display: grid; grid-template-columns: 1fr 76px 76px 24px; gap: 4px; align-items: center; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px dashed #2a3a44; }
  .modRow .front { grid-column: span 2; }
  .modRow select { margin: 0; }
  .modRow input { width: 44px; }
  .checks { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 2px; color: var(--muted); }
  #out { width: 100%; height: 120px; margin-top: 8px; font: 12px/1.4 Consolas, monospace; background: #0a141b; color: var(--text); border: 1px solid var(--line); }
  .hint { color: var(--muted); font-size: 12px; }
  #msg { color: var(--teal); }
  #stage .fx { position: absolute; inset: 0; pointer-events: none; }
  #stage .layer.fxShafts { isolation: auto; }   /* 光の筋は下の絵と「スクリーン」で混ぜる */
  .card.fxCard { border-color: #3c6d70; }
  .card.exCard { border-color: #8a6d3c; }
  .card.scCard { border-color: #6d7f9a; }
  .card.scCard .checks button { font-size: 12px; }
  .exRow { display: grid; grid-template-columns: 1fr 62px 56px 44px; gap: 4px; align-items: center; margin: 2px 0; font-size: 12px; }
  .exRow input { width: 100%; box-sizing: border-box; padding: 1px 3px; }
  .exRow.head { color: var(--muted); }
  .exRow button { padding: 0 4px; }
  .exRow .auto { color: var(--muted); }
  #stage .layer.exLayer { pointer-events: none; z-index: 5; isolation: auto; }
  #stage .exMark { position: absolute; pointer-events: auto; cursor: ew-resize; user-select: none; }
  #stage .exMark .tag { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; padding: 0 4px; background: rgba(8,12,18,.78); border-radius: 2px; }
  #stage .exMark.drag .tag { outline: 1px solid #fff; }
  .card.fxCard .row { grid-template-columns: 104px 1fr 54px; }
  .card.fxCard .colorRow { grid-template-columns: 104px 1fr; }
  .perLayer { border-top: 1px dashed #2a3a44; margin-top: 4px; padding-top: 3px; }
  .perTitle { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
  .perTitle button { padding: 0 6px; font-size: 12px; }
  .colorRow { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 6px; margin: 2px 0; }
  .colorRow input { width: 64px; height: 22px; padding: 0 2px; }
  .colorRow select { width: auto; margin: 0; }
</style>
</head>
<body>
<header>
  <h1>横スクロールの重ね方</h1>
  <label>場所 <select id="place"></select></label>
  <button id="newPlace" title="新しい場所を足す（空・遠景・中景・床・モジュールのひな形から始める）">場所を足す</button>
  <label title="同じ場所でも、場面（朝・昼・夕方、だれがいるか）ごとに見え方と組み立てを分けて保存する">シーン <select id="scene"></select></label>
  <button id="newScene" title="配置表にない試しのシーンを足す（例: 夕方の試し）">シーンを足す</button>
  <label title="Unity の見え方のファイルの名前（Assets/Data/Looks/<名前>.json）">見え方の名前 <input id="lookName" type="text" style="width:170px"></label>
  <label>素材のフォルダ <input id="folder" type="text" value="背景/オルクス城回廊横スクロール/採用候補/"></label>
  <button id="reload" title="素材のフォルダと 背景/ の中の絵を読み直す（新しく置いた絵を出す）">読み込み直す</button>
  <button id="add">層を足す</button>
  <button id="addProps" title="家具など1つずつ置く物の層を足す">家具の層を足す</button>
  <button id="copy">コピー</button>
  <button id="reset" title="場所のふだん: 場所全体を Unity の値に。シーン: そのシーンだけを Unity の値（その場面の見え方）に">はじめの値に戻す</button>
  <button id="saveFile" title="この場所の、ふだんと全部のシーンをファイルに保存する（ブラウザを替えても使えるように）">ファイルに保存</button>
  <button id="openFile" title="「ファイルに保存」したファイルを読み込む">ファイルを開く</button>
  <input id="fileIn" type="file" accept=".json,application/json" hidden>
  <span id="msg"></span>
</header>
<main>
  <div>
    <svg width="0" height="0" style="position:absolute"><defs id="fxDefs"></defs></svg>
    <div id="wrap"><div id="stage"><div id="world"><div id="feet"></div><img id="hero" alt=""></div></div></div>
    <div class="bar">
      <label>カメラ <input id="cam" type="range" min="0" max="4000" value="0" style="width:340px"> <span id="camV">0</span></label>
      <button id="play">▶ 流す</button>
      <label>表示の大きさ <select id="zoom"><option value="1" selected>1倍</option><option value="1.5">1.5倍</option><option value="2">2倍</option></select></label>
    </div>
    <div class="bar" id="camBar">
      <b>このシーンのカメラ</b>
      <label title="1 がふだん。小さいほど引き（広く見える）、大きいほど寄り">大きさ <input id="camZoom" type="range" min="0.5" max="2" step="0.01" value="1" style="width:150px"> <input id="camZoomN" type="number" step="0.01" value="1" style="width:56px"></label>
      <label title="見る所を右へずらす（負なら左）">横 <input id="camX" type="number" value="0" style="width:60px"></label>
      <label title="見る所を上へずらす（負なら下）。空を見上げるときなど">縦 <input id="camY" type="number" value="0" style="width:60px"></label>
      <button id="camReset">ふつうに戻す</button>
      <label title="このシーンの会話で、上下の黒い帯を出す"><input id="bandsOn" type="checkbox" checked> 会話の帯を出す</label>
      <label title="会話のときの見え方（上下の帯）を、この画面に重ねて見る"><input id="talkPreview" type="checkbox"> 会話の見本</label>
    </div>
    <p class="hint" style="margin:4px 0 0">引くと、層の絵の外（黒）が見えることがあります。そのときは空や床の層の「高さ」「下の端」を広げてください。</p>
    <div class="bar">
      <label>アルシェ（大きさの目安） 足元の高さ <input id="heroY" type="number" value="352" style="width:60px"></label>
      <label>背の高さ <input id="heroH" type="number" value="96" style="width:60px"></label>
      <label><input id="heroOn" type="checkbox" checked> 出す</label>
      <label title="カメラが回廊の両端からこれだけ内側で止まる（端の外の空を見せない）">カメラの端の余白 <input id="camMargin" type="number" value="60" style="width:60px"></label>
    </div>
    <p class="hint">
      層は下の欄の上から奥→手前の順に重なります。数値はゲームの画面（844×390）での大きさです。<br>
      「くり返す」は横に並べます。「重ね幅」を増やすと継ぎ目が重なります（庭など）。「床」は真上から見た素材を縦につぶして帯にします。<br>
      決まったら「コピー」を押して、総合担当に貼ってください。動かした値はこのブラウザに残ります。
    </p>
    <textarea id="out" readonly></textarea>
  </div>
  <div id="layers"></div>
</main>
<script>
const STORE = "srpg.corridorLayers.v4";   // v4: 回廊を端つきの並びに   // v2: 遠景をつながる形に分けた（前の値は使わない）
const $ = id => document.getElementById(id);
let files = [];
let layers = [];

// 場所: Unity の場所データ（unity-prototype/Assets/Data/Corridors/<場所>.json）と、このページで足した場所（2026-10-03）
// 「はじめの値」は Unity に入っている値。Unity にまだない場所は、空・遠景・中景・床・モジュールのひな形から始める
const UNITY_DIR = "/unity-prototype/Assets/Data/Corridors/";
const PLACES_KEY = "srpg.corridorPlaces";     // このページで足した場所 [{ id, folder }]
const LAST_KEY = "srpg.corridorPlace";        // 最後に開いた場所
let place = "orcus_castle";
let places = [];                               // [{ id, folder, unity }]
// オルクス城の回廊は前からの保存の名前をそのまま使う（合わせた値を消さない）
const storeKey = id => id === "orcus_castle" ? STORE : `srpg.corridorLayers.${id}`;
const TEMPLATE = [
  { name: "空", file: "", kind: "image", height: 390, bottom: 390, x: 0, overlap: 0, speed: 0.03, repeat: true, mirror: false, opacity: 1, on: true },
  { name: "遠景", file: "", kind: "image", height: 250, bottom: 280, x: 0, overlap: 0, speed: 0.15, repeat: true, mirror: false, opacity: 1, on: true },
  { name: "中景", file: "", kind: "image", height: 210, bottom: 350, x: 0, overlap: 0, speed: 0.45, repeat: true, mirror: false, opacity: 1, on: true },
  { name: "床（真上からの素材を帯に）", file: "", kind: "floor", top: 321, bottom: 390, tile: 120, rows: 2, x: 0, speed: 1, shade: 0.5, on: true },
  { name: "モジュール（左の端・くり返し・右の端）", kind: "modules", height: 391, bottom: 390, x: 0, speed: 1, opacity: 1, on: true, modules: [] },
];

const clone = v => JSON.parse(JSON.stringify(v));
const readJson = (k, v) => { try { return JSON.parse(localStorage.getItem(k) || "null") ?? v; } catch { return v; } };
const writeJson = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

async function listPlaces() {
  let unity = [];
  try {
    const html = await (await fetch(UNITY_DIR)).text();
    unity = [...html.matchAll(/href="([^"]+)\.json"/gi)].map(m => decodeURIComponent(m[1]));
  } catch {}
  const mine = readJson(PLACES_KEY, []);
  places = [...unity.map(id => ({ id, unity: true })), ...mine.filter(m => !unity.includes(m.id))];
  if (!places.some(p => p.id === place)) places.unshift({ id: place, unity: false });
  $("place").innerHTML = places.map(p => `<option value="${p.id}" ${p.id === place ? "selected" : ""}>${p.id}${p.unity ? "" : "（Unity にまだない）"}</option>`).join("");
}

// 見え方（Unity の Assets/Data/Looks/<名前>.json）: 空の差し替え・効果・層ごとの霞とぼかし・この場面だけの組み立て（build）
const LOOK_DIR = "/unity-prototype/Assets/Data/Looks/";
async function fetchLook(name) {
  if (!name) return null;
  try { const r = await fetch(`${LOOK_DIR}${encodeURIComponent(name)}.json`, { cache: "no-store" }); if (r.ok) return await r.json(); } catch {}
  return null;
}
// 空の層: Unity と同じく、モジュールと床でない最初の層
const skyLayerOf = ls => ls.find(L => L.on !== false && L.kind !== "modules" && L.kind !== "floor");
/** 見え方を層に重ねる（Unity の Corridor2DView.LoadLook・ApplyLayerEffects と同じ決め方） */
function lookOnto(ls, look) {
  if (!look) return ls;
  if (look.build?.length) ls = clone(look.build).map(L => ({ ...L, on: true }));
  const sky = skyLayerOf(ls);
  if (look.sky && sky) sky.file = "/" + look.sky.replace(/^\/+/, "");
  for (const o of look.layers || []) {
    const L = ls.find(x => x.name === o.name);
    if (!L) continue;
    if (o.haze >= 0) L.fxHaze = o.haze;
    if (o.blur >= 0) L.fxBlur = o.blur;
  }
  return ls;
}
// はじめの値: Unity の場所データ（とその見え方）。シーンを指定すると、その場面の見え方（explore.looks）を重ねる。Unity にない場所はひな形
async function defaultsFor(id, stateId = "") {
  try {
    const r = await fetch(`${UNITY_DIR}${encodeURIComponent(id)}.json`, { cache: "no-store" });
    if (r.ok) {
      const d = await r.json();
      const mapped = stateId ? (d.explore?.looks || []).find(l => l.state === stateId)?.look || "" : "";
      const lookName = mapped || d.look || "";
      const look = await fetchLook(lookName);
      return { folder: d.folder, hero: { y: d.heroFeetY ?? 352, h: d.heroHeight ?? 96, margin: d.cameraMargin ?? 60 },
        layers: lookOnto(d.layers.map(L => ({ ...L, on: true })), look), effects: look?.effects ?? d.effects, lookName, mapped: !!mapped,
        camera: look?.camera?.zoom > 0 ? look.camera : d.camera, bands: !(look?.hideTalkBands || d.hideTalkBands),
        explore: d.explore ? { ...d.explore, spots: d.explore.spots || [] } : null, walk: { min: d.walkMin ?? 40, max: d.walkMax ?? -40 } };
    }
  } catch {}
  const mine = readJson(PLACES_KEY, []).find(m => m.id === id);
  return { folder: mine?.folder || `背景/${id}/採用候補/`, hero: { y: 352, h: 96, margin: 60 }, layers: clone(TEMPLATE), lookName: "", mapped: false };
}

// ── シーン（2026-10-04 原作者: シーンごとの保存・組み立て・はじめの値・選択） ──
// シーン＝場所の中の場面（配置表の場面 = Unity の状態。朝に起きる・昼に御伽噺を調べる など）と、ここで足した試しのシーン。
// 場所全体のこと（素材のフォルダ・アルシェの大きさ・歩ける範囲・探索の配置）は場所のふだんに、
// 見え方（空・効果・層ごとの霞とぼかし）と組み立て（層の並び）はシーンごとに保存する。
// 組み立てが場所のふだんと違えば、書き出しに build（このシーンだけの組み立て）を付ける。
let scene = "";             // "" = 場所のふだん
let lookName = "";
let baseLayersCache = [];   // 場所のふだんの組み立て（シーンの組み立てと比べる）
let sceneCam = { zoom: 1, x: 0, y: 0 }, bands = true;   // この場面のカメラと会話の帯（原作者 2026-10-05）
const camOf = c => ({ zoom: Number(c?.zoom) > 0 ? Number(c.zoom) : 1, x: Number(c?.x) || 0, y: Number(c?.y) || 0 });
const camIsPlain = c => c.zoom === 1 && !c.x && !c.y;
function showCam() {
  $("camZoom").value = sceneCam.zoom; $("camZoomN").value = sceneCam.zoom; $("camX").value = sceneCam.x; $("camY").value = sceneCam.y;
  $("bandsOn").checked = bands;
}
const SCENE_LAST = "srpg.corridorScene";            // { 場所: 最後に開いたシーン }
const customKey = () => `srpg.corridorScenes.${place}`;   // ここで足した試しのシーン [{ id, title }]
const sceneKey = id => `${storeKey(place)}@${id}`;
const mapStates = () => exMap?.states || [];
const sceneTitle = id => mapStates().find(s => s.id === id)?.scene || readJson(customKey(), []).find(s => s.id === id)?.title || "";
const shownState = () => (scene && mapStates().some(s => s.id === scene)) ? scene : ex?.state;
function listScenes() {
  const opts = [`<option value="">（場所のふだん）</option>`]
    .concat(mapStates().map(s => `<option value="${s.id}" ${s.id === scene ? "selected" : ""}>${s.id}${s.scene ? "　" + shortLabel(s.scene) : ""}${readJson(sceneKey(s.id), null) ? " ＊" : ""}</option>`))
    .concat(readJson(customKey(), []).map(s => `<option value="${s.id}" ${s.id === scene ? "selected" : ""}>${s.id}　${s.title || "試し"}（試し）${readJson(sceneKey(s.id), null) ? " ＊" : ""}</option>`));
  $("scene").innerHTML = opts.join("");
  $("scene").value = scene;
}
/** 組み立てだけを比べるための形（空の絵・霞とぼかし・出す/出さないの印は除く） */
function buildShape(ls) {
  const on = ls.filter(L => L.on !== false), sky = skyLayerOf(on);
  return JSON.stringify(on.map(L => { const o = layerExport(L); delete o.fxHaze; delete o.fxBlur; delete o.name; if (L === sky) delete o.file; return o; }));
}
const ownBuild = () => scene && buildShape(layers) !== buildShape(baseLayersCache);
async function baseLayers() {
  const s = readJson(storeKey(place), null);
  return s?.layers ? s.layers : (await defaultsFor(place)).layers;
}
/** シーンを開く。保存がなければ: Unity にその場面の見え方があればそれ、なければ場所のふだんの写し */
async function enterScene(id, noSave = false) {
  if (!noSave) save();
  scene = id;
  const last = readJson(SCENE_LAST, {}); last[place] = id; writeJson(SCENE_LAST, last);
  baseLayersCache = clone(await baseLayers());
  if (!id) {
    const s = readJson(storeKey(place), null);
    applyLook(s?.layers ? s : await defaultsFor(place));
  } else {
    const s = readJson(sceneKey(id), null);
    if (s?.layers) applyLook(s);
    else {
      const d = await defaultsFor(place, id);
      if (d.mapped) applyLook(d);
      else {
        const b = readJson(storeKey(place), null);
        applyLook({ layers: clone(baseLayersCache), effects: clone(b?.effects || fx), lookName: suggestLookName(id), camera: b?.camera, bands: b?.bands });
      }
    }
  }
  listScenes();
}
function suggestLookName(id) {
  const t = sceneTitle(id);
  const tod = /朝/.test(t) ? "morning" : /昼/.test(t) ? "noon" : /夕/.test(t) ? "dusk" : /夜/.test(t) ? "night" : id.replace(/^.*?_(\w+)$/, "$1");
  return `${place}_${tod}`;
}
function applyLook(state) {
  layers = clone(state.layers);
  fx = { ...clone(FX_DEFAULT), ...(state.effects || {}) };
  fx.chara = { ...clone(FX_DEFAULT.chara), ...(fx.chara || {}) };
  lookName = state.lookName ?? "";
  $("lookName").value = lookName;
  sceneCam = camOf(state.camera);
  bands = state.bands ?? !state.hideTalkBands;
  showCam();
}

// 効果（画面全体）: 空気遠近・被写界深度・ヴィネット・色調・光の筋（原作者 2026-10-04。まず調整ページで見比べ、Unity はあとで）
const FX_DEFAULT = { on: true, haze: 0.25, hazeColor: "#a9b8e8", dof: 1.5, vignette: 0.35, vignetteColor: "#0b0d18", vignetteSize: 0.55,
  bright: 1, contrast: 1, saturate: 1, temp: 0, shafts: 0, shaftColor: "#ffe0a8", shaftAngle: 20, shaftY: 0, shaftX: 0, shaftWidth: 1,

const resolved = {};
const UNITY_ART = () => ["/unity-prototype/Assets/Art/Corridor/", `/unity-prototype/Assets/Art/Side2D/${place}/`, "/unity-prototype/Assets/Art/Sky/"];
function url(file) { return encodeURI(file.startsWith("/") ? file : resolved[file] || folderUrl() + file); }
const SKY_DIR = "/背景/空/";   // 時間帯・天気の空（原作者 2026-10-04。オルクス○○＝百年戦争中の治安が最悪な頃の空）

const BG_DIR = "/背景/";

async function listBackgrounds() {
  const groups = [];
  async function walk(dir, depth) {
    let html;
    try { html = await (await fetch(encodeURI(dir), { cache: "no-store" })).text(); } catch { return; }
    const hrefs = [...html.matchAll(/href="([^"?#]+)"/gi)].map(m => decodeURIComponent(m[1])).filter(h => !h.startsWith("/") && !h.startsWith(".."));
    const images = hrefs.filter(h => /\.(png|webp|jpe?g)$/i.test(h)).map(h => dir + h).sort();
    if (images.length) groups.push({ folder: dir, files: images });
    if (depth < 4) for (const sub of hrefs.filter(h => h.endsWith("/"))) await walk(dir + sub, depth + 1);
  }
  await walk(BG_DIR, 0);

}
/** 背景/ の絵を、フォルダごとのまとまりにした選択肢（今の場所のフォルダは上に出しているので除く） */
function bgOptions(selected) {

  return bgGroups.filter(g => g.folder !== here).map(g => `<optgroup label="${g.folder.slice(1)}">`
    + g.files.map(f => `<option value="${f}" ${f === selected ? "selected" : ""}>${f.slice(g.folder.length)}</option>`).join("") + "</optgroup>").join("");
}
function size(file) {
  if (!file) return Promise.resolve(null);
  if (sizes[file]) return Promise.resolve(sizes[file]);
  const tries = file.startsWith("/") ? [file] : [folderUrl() + file, ...UNITY_ART().map(d => d + file)];
  const load = src => new Promise(ok => { const im = new Image(); im.onload = () => ok({ w: im.naturalWidth, h: im.naturalHeight }); im.onerror = () => ok(null); im.src = encodeURI(src); });
  return (async () => {
    for (const src of tries) { const s = await load(src); if (s) { resolved[file] = src; sizes[file] = s; return s; } }
    return null;
  })();
}

// ── 描く ──
let renderToken = 0;   // つまみを速く動かすと描く処理が重なるので、新しい方だけ続ける
async function render() {
  const token = ++renderToken;
  const stage = $("stage");
  stage.querySelectorAll(".layer, .fx").forEach(e => e.remove());
  const defs = $("fxDefs");
  defs.innerHTML = "";
  const shafts = [];   // 光の筋の位置（アーチの真ん中。左右の端の絵は除く）
  let firstOn = true;
  // カメラは「回廊（端つきの並び）」の両端から余白だけ内側で止める（Unity と同じ）
  const corridorLen = layers.find(L => L.kind === "modules" && L.on)?._length;
  let cam = Number($("cam").value);
  const wide = 422 * (1 / sceneCam.zoom - 1);   // 引いた分だけ、カメラは内側で止める（Unity と同じ）
  if (corridorLen) { cam = Math.max(hero.margin + wide, Math.min(cam, corridorLen - 844 - hero.margin - wide)); $("cam").max = Math.ceil(corridorLen); }
  const feet = $("feet"), heroImg = $("hero"), camEl = $("world");
  // この場面のカメラ: 画面の真ん中を中心に大きさを変え、見る所をずらす（Unity の Corridor2DView.ApplyZoom と同じ）
  const z = sceneCam.zoom;
  camEl.style.transform = `translate(${-sceneCam.x * z}px, ${sceneCam.y * z}px) scale(${z})`;
  const extra = Math.ceil(Math.max(0, 422 * (1 / z - 1)) + Math.abs(sceneCam.x) + 8);   // 引いたとき・ずらしたときに見える、画面の外の幅
  for (const L of layers) {
    if (!L.on) continue;
    const box = document.createElement("div");
    box.className = "layer";
    camEl.insertBefore(box, feet);
    const shift = L.x - cam * L.speed;
    // 奥ほど（流れる速さが遅いほど）霞とぼかしを強く。いちばん奥の層（空）には霞をかけない
    if (fx.on) {
      const filters = [];
      const haze = layerHaze(L, firstOn), blur = layerBlur(L);
      if (haze > 0) {
        const id = `haze${layers.indexOf(L)}`;
        defs.insertAdjacentHTML("beforeend", `<filter id="${id}" color-interpolation-filters="sRGB"><feFlood flood-color="${fx.hazeColor}" flood-opacity="${haze.toFixed(3)}" result="f"/><feComposite in="f" in2="SourceGraphic" operator="in" result="t"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="t"/></feMerge></filter>`);
        filters.push(`url(#${id})`);
      }
      if (blur > 0.05) filters.push(`blur(${blur.toFixed(2)}px)`);
      box.style.filter = filters.join(" ");
    }
    firstOn = false;
    if (L.kind === "floor") {
      if (L.file) { await size(L.file); if (token !== renderToken) return; }   // 絵の場所を探しておく
      const h = Math.max(1, L.bottom - L.top), rows = Math.max(1, L.rows);
      for (let r = 0; r < rows; r++) {
        const row = document.createElement("div");
        row.className = "floorRow";
        const rh = h / rows;
        Object.assign(row.style, { left: `${-extra}px`, right: `${-extra}px`, top: `${L.top + r * rh}px`, height: `${rh + 0.5}px`,
          backgroundImage: L.file ? `url("${url(L.file)}")` : "repeating-linear-gradient(90deg,#5c5866 0 58px,#3d3a46 58px 60px)",
          backgroundSize: `${L.tile}px ${rh + 0.5}px`, backgroundPosition: `${shift + extra}px 0` });
        box.appendChild(row);
      }
      const shade = document.createElement("div");
      shade.className = "shade";
      Object.assign(shade.style, { left: `${-extra}px`, right: `${-extra}px`, top: `${L.top}px`, height: `${h}px`, background: `linear-gradient(180deg, rgba(10,14,22,${L.shade}), rgba(10,14,22,0))` });
      box.appendChild(shade);

    }
    if (L.kind === "props") {

      for (const pr of L.props || []) {
        const ps = await size(pr.file);
        if (token !== renderToken) return;
        if (!ps) continue;
        const ph = Number(pr.height), pw = ps.w * ph / ps.h;
        const img = document.createElement("img");
        img.src = url(pr.file);
        Object.assign(img.style, { left: `${shift + Number(pr.x) - pw / 2}px`, top: `${Number(pr.bottom) - ph}px`, width: `${pw}px`, height: `${ph}px`, opacity: L.opacity ?? 1,
          transform: pr.flip ? "scaleX(-1)" : "none" });
        box.appendChild(img);
      }
      continue;
    }
    if (L.kind === "modules") {
      let cursor = 0;
      for (let m = 0; m < (L.modules || []).length; m++) {
        const mod = L.modules[m];
        const ms = await size(mod.file);
        if (token !== renderToken) return;
        if (!ms) continue;
        const mw = ms.w * (L.height / ms.h);
        if (m > 0) cursor -= Number(mod.overlap || 0);
        const sc = Number(mod.scale || 1), w2 = mw * sc, h2 = L.height * sc;
        const left = shift + cursor + Number(mod.dx || 0) - (w2 - mw) / 2, top = L.bottom - h2 + Number(mod.dy || 0);
        if (Number(mod.shadeTop) > 0) {
          // 絵の上の透けた三角から空が見えないよう、後ろに暗い天井の色を敷く（Unity と同じ色）
          const shade = document.createElement("div");
          Object.assign(shade.style, { position: "absolute", left: `${left}px`, top: `${top}px`, width: `${w2}px`, height: `${Number(mod.shadeTop)}px`, background: "rgb(28,24,34)", opacity: L.opacity, zIndex: 0 });   // 「手前」でも天井はいちばん奥（となりの絵の上に出さない）
          box.appendChild(shade);
        }
        const img = document.createElement("img");
        img.src = url(mod.file);
        Object.assign(img.style, { left: `${left}px`, top: `${top}px`, width: `${w2}px`, height: `${h2}px`, opacity: L.opacity,
          zIndex: mod.front ? 2 : 1 });
        box.appendChild(img);
        if (m > 0 && m < L.modules.length - 1) shafts.push({ x: left + w2 / 2 + Number(fx.shaftX || 0), top: top + h2 * 0.28 + Number(fx.shaftY || 0), bottom: L.bottom - 8, w: mw * 0.34 * Number(fx.shaftWidth || 1) });
        cursor += mw;

        // 光の筋: アーチの間から斜めに差して、床に明るいところを落とす
        const sb = document.createElement("div");
        sb.className = "layer fxShafts";
        camEl.insertBefore(sb, feet);
        const tan = Math.tan(fx.shaftAngle * Math.PI / 180);   // 筋は skewX(−角度) で下の端が左へ h×tan ずれる。床の光はその下の端に落とす
        for (const sh of shafts) {
          const h = sh.bottom - sh.top;
          const ray = document.createElement("div");
          Object.assign(ray.style, { position: "absolute", left: `${sh.x - sh.w / 2}px`, top: `${sh.top}px`, width: `${sh.w}px`, height: `${h}px`,
            transformOrigin: "top center", transform: `skewX(${-fx.shaftAngle}deg)`, mixBlendMode: fx.shaftBlend, filter: `blur(${fx.shaftSoft}px)`,
            background: `linear-gradient(180deg, transparent, ${fx.shaftColor} 35%, transparent)`, opacity: fx.shafts });
          sb.appendChild(ray);
          if (fx.shaftGlow > 0) {
            // にじみ: 太く大きくぼかした筋をもう1本重ねる
            const glow = ray.cloneNode();
            Object.assign(glow.style, { left: `${sh.x - sh.w}px`, width: `${sh.w * 2}px`, filter: `blur(${fx.shaftSoft * 3 + 6}px)`, opacity: fx.shafts * fx.shaftGlow });
            sb.appendChild(glow);
          }
          const pool = document.createElement("div");
          Object.assign(pool.style, { position: "absolute", left: `${sh.x - h * tan - sh.w * 0.8}px`, top: `${sh.bottom - 22}px`, width: `${sh.w * 1.6}px`, height: "34px",
            borderRadius: "50%", mixBlendMode: fx.shaftBlend, filter: `blur(${fx.shaftSoft + 2}px)`, background: fx.shaftColor, opacity: fx.shafts * (0.7 + fx.shaftGlow * 0.3) });
          sb.appendChild(pool);
        }
      }
      continue;
    }
    const s = await size(L.file);
    if (token !== renderToken) return;
    if (!s) continue;
    const w = s.w * (L.height / s.h);
    const step = Math.max(8, w - (L.overlap || 0));
    let start = shift;
    if (L.repeat) { start = shift % step; if (start > 0) start -= step; start -= Math.ceil(extra / step) * step; }
    for (let i = 0, x = start; x < 844 + extra && (L.repeat || i === 0); i++, x += step) {
      const img = document.createElement("img");
      img.src = url(L.file);
      Object.assign(img.style, { left: `${x}px`, top: `${L.bottom - L.height}px`, width: `${w}px`, height: `${L.height}px`, opacity: L.opacity,
        transform: L.mirror && i % 2 ? "scaleX(-1)" : "none" });
      box.appendChild(img);
    }
  }
  // 色調（明るさ・コントラスト・彩度）は画面全体、色温度は暖色／寒色を「ソフトライト」で重ねる、ヴィネットは四隅を暗く
  stage.style.filter = fx.on ? `brightness(${fx.bright}) contrast(${fx.contrast}) saturate(${fx.saturate})` : "";
  if (fx.on && fx.temp) {
    const t = document.createElement("div");
    t.className = "fx";
    Object.assign(t.style, { background: fx.temp > 0 ? "#ff9a3c" : "#3c7cff", mixBlendMode: "soft-light", opacity: Math.abs(fx.temp) * 0.6 });
    stage.appendChild(t);
  }
  if (fx.on && fx.ovl > 0) {
    const o = document.createElement("div");
    o.className = "fx";
    Object.assign(o.style, { background: `linear-gradient(180deg, ${fx.ovlTop}, ${fx.ovlBottom})`, mixBlendMode: fx.ovlMode, opacity: fx.ovl });
    stage.appendChild(o);
  }
  if (fx.on && fx.vignette > 0) {
    const v = document.createElement("div");
    v.className = "fx";
    Object.assign(v.style, { background: `radial-gradient(ellipse 72% 78% at 50% 50%, transparent ${Math.round(fx.vignetteSize * 100)}%, ${fx.vignetteColor} 100%)`, opacity: fx.vignette });
    stage.appendChild(v);

  drawExplore(camEl, cam);
  // 会話の見本: 上下の黒い帯（この場面で帯を出すとき）
  if ($("talkPreview").checked && bands)
    for (const top of [true, false]) { const b = document.createElement("div"); b.className = "fx band"; b.style[top ? "top" : "bottom"] = "0"; stage.appendChild(b); }
  feet.style.top = `${hero.y}px`;
  feet.style.display = hero.on ? "" : "none";
  heroImg.style.display = hero.on ? "" : "none";
  Object.assign(heroImg.style, { height: `${hero.h}px`, top: `${hero.y - hero.h}px`, left: `${422 - hero.h * 0.28}px` });
  // キャラの効果: 霞（霞の色へ寄せる）と、なじませ（場の色へ寄せる）を重ね、明るさ・ぼかし
  const c = fx.chara, cf = [];
  if (fx.on) {
    const tint = (id, color, a) => {
      defs.insertAdjacentHTML("beforeend", `<filter id="${id}" color-interpolation-filters="sRGB"><feFlood flood-color="${color}" flood-opacity="${a.toFixed(3)}" result="f"/><feComposite in="f" in2="SourceGraphic" operator="in" result="t"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="t"/></feMerge></filter>`);
      cf.push(`url(#${id})`);
    };
    if (c.haze > 0) tint("charaHaze", fx.hazeColor, c.haze);
    if (c.tint > 0) tint("charaTint", c.tintColor, c.tint);
    if (c.bright !== 1) cf.push(`brightness(${c.bright})`);
    if (c.blur > 0.05) cf.push(`blur(${c.blur}px)`);
  }

  $("out").value = exportText();

}

  const o = { look: st.lookName || "", place, scene: id, title: sceneTitle(id), sky: skyFile.replace(/^\/+/, ""), effects: st.effects,
    layers: on.filter(L => L.fxHaze !== undefined || L.fxBlur !== undefined).map(L => ({ name: L.name, ...(L.fxHaze !== undefined ? { haze: L.fxHaze } : {}), ...(L.fxBlur !== undefined ? { blur: L.fxBlur } : {}) })) };
  if (buildShape(st.layers) !== buildShape(baseLayersCache)) o.build = on.map(layerExport);

        const row = document.createElement("div");
        row.className = "modRow";
        row.innerHTML = `<select>${files.map(f => `<option ${f === pr.file ? "selected" : ""}>${f}</option>`).join("")}${bgOptions(pr.file)}</select>`
          + `<label>横 <input type="number" value="${pr.x}"></label><label>下 <input type="number" value="${pr.bottom}"></label><button title="消す">×</button>`
          + `<label>高さ <input type="number" value="${pr.height}"></label><label class="front"><input type="checkbox" ${pr.flip ? "checked" : ""}> 左右反転</label>`;
        const [psel] = row.getElementsByTagName("select");
        const [xi, bi, hi, fi] = row.querySelectorAll("input");
        psel.addEventListener("change", () => { pr.file = psel.value; render(); });
        xi.addEventListener("input", () => { pr.x = Number(xi.value); render(); });
        bi.addEventListener("input", () => { pr.bottom = Number(bi.value); render(); });
        hi.addEventListener("input", () => { pr.height = Number(hi.value); render(); });
        fi.addEventListener("change", () => { pr.flip = fi.checked; render(); });
        row.querySelector("button").addEventListener("click", () => { L.props.splice(k, 1); cards(); render(); });
        card.appendChild(row);
      });
      const addP = document.createElement("button");
      addP.textContent = "＋ 物を足す";
      addP.addEventListener("click", () => { (L.props ||= []).push({ file: files[0] || "", x: Number($("cam").value) + 422, bottom: 370, height: 150, flip: false }); cards(); render(); });
      card.appendChild(addP);
      card.appendChild(slider(L, "speed", "流れる速さ", 0, 1.5, 0.01));
      host.appendChild(card);
      return;
    }
    if (L.kind === "modules") {
      // 並べる絵: 1つずつ「絵・左と重ねる幅・上下のずれ」。＋で足す、×で消す
      L.modules.forEach((mod, m) => {
        const row = document.createElement("div");
        row.className = "modRow";
        row.innerHTML = `<select>${files.map(f => `<option ${f === mod.file ? "selected" : ""}>${f}</option>`).join("")}${bgOptions(mod.file)}</select>`
          + `<label>重ね <input type="number" value="${mod.overlap}" ${m === 0 ? "disabled" : ""}></label><label>上下 <input type="number" value="${mod.dy}"></label><button title="消す">×</button>`
          + `<label>左右 <input type="number" value="${mod.dx || 0}"></label><label>大きさ <input type="number" step="0.01" value="${mod.scale || 1}"></label><label title="絵の上からこの高さまで、後ろに暗い天井の色を敷く（端の上の三角から空が見えるとき）">天井 <input type="number" value="${mod.shadeTop || 0}"></label><label class="front"><input type="checkbox" ${mod.front ? "checked" : ""}> 手前</label>`;
        const [msel] = row.getElementsByTagName("select");
        const [ov, dy, dxIn, scIn, shIn, frontIn] = row.querySelectorAll("input");
        shIn.addEventListener("input", () => { mod.shadeTop = Number(shIn.value); render(); });
        dxIn.addEventListener("input", () => { mod.dx = Number(dxIn.value); render(); });
        scIn.addEventListener("input", () => { mod.scale = Number(scIn.value) || 1; render(); });
        frontIn.addEventListener("change", () => { mod.front = frontIn.checked; render(); });
        msel.addEventListener("change", () => { mod.file = msel.value; render(); });
        ov.addEventListener("input", () => { mod.overlap = Number(ov.value); render(); });
        dy.addEventListener("input", () => { mod.dy = Number(dy.value); render(); });
        row.querySelector("button").addEventListener("click", () => { L.modules.splice(m, 1); cards(); render(); });
        card.appendChild(row);
      });
      const add = document.createElement("button");
      add.textContent = "＋ 絵を足す";
      add.addEventListener("click", () => { const last = L.modules[L.modules.length - 1]; L.modules.push({ file: last?.file || files[0], overlap: 39, dy: 0 }); cards(); render(); });
      card.appendChild(add);
      card.appendChild(slider(L, "height", "高さ", 20, 800, 1));
      card.appendChild(slider(L, "bottom", "下の端", 0, 500, 1));
      card.appendChild(slider(L, "x", "横の位置", -1000, 2000, 1));
      card.appendChild(slider(L, "speed", "流れる速さ", 0, 1.5, 0.01));
      host.appendChild(card);
      return;
    }
    const sel = document.createElement("select");
    sel.innerHTML = `<option value="">（素材なし${L.kind === "floor" ? "・仮の縞" : ""}）</option>` + files.map(f => `<option ${f === L.file ? "selected" : ""}>${f}</option>`).join("")
      + bgOptions(L.file);
    sel.addEventListener("change", () => { L.file = sel.value; render(); });
    card.appendChild(sel);
    if (L.kind === "floor") {
      card.appendChild(slider(L, "top", "上の端", 200, 390, 1));
      card.appendChild(slider(L, "bottom", "下の端", 250, 420, 1));
      card.appendChild(slider(L, "tile", "素材の幅", 20, 400, 1));
      card.appendChild(slider(L, "rows", "段の数", 1, 6, 1));
      card.appendChild(slider(L, "shade", "奥の暗さ", 0, 1, 0.05));
    } else {
      card.appendChild(slider(L, "height", "高さ", 20, 800, 1));
      card.appendChild(slider(L, "bottom", "下の端", 0, 500, 1));
      card.appendChild(slider(L, "overlap", "重ね幅", 0, 400, 1));
      card.appendChild(slider(L, "opacity", "濃さ", 0, 1, 0.05));
    }
    card.appendChild(slider(L, "x", "横の位置", -1000, 2000, 1));
    card.appendChild(slider(L, "speed", "流れる速さ", 0, 1.5, 0.01));
    if (L.kind !== "floor") {
      const checks = document.createElement("div");
      checks.className = "checks";
      checks.appendChild(check(L, "repeat", "くり返す"));
      checks.appendChild(check(L, "mirror", "1つおきに左右反転"));
      card.appendChild(checks);
    }
    host.appendChild(card);
  });
}

// ── 操作 ──
$("cam").addEventListener("input", render);
function setCam(patch) { sceneCam = camOf({ ...sceneCam, ...patch }); showCam(); render(); }
$("camZoom").addEventListener("input", e => setCam({ zoom: Number(e.target.value) }));
$("camZoomN").addEventListener("change", e => setCam({ zoom: Number(e.target.value) }));
$("camX").addEventListener("change", e => setCam({ x: Number(e.target.value) }));
$("camY").addEventListener("change", e => setCam({ y: Number(e.target.value) }));
$("camReset").addEventListener("click", () => setCam({ zoom: 1, x: 0, y: 0 }));
$("bandsOn").addEventListener("change", e => { bands = e.target.checked; render(); });
$("talkPreview").addEventListener("change", render);
let timer = null;
$("play").addEventListener("click", () => {
  if (timer) { clearInterval(timer); timer = null; $("play").textContent = "▶ 流す"; return; }
  $("play").textContent = "■ 止める";
  timer = setInterval(() => { const c = $("cam"); c.value = (Number(c.value) + 4) % Number(c.max); render(); }, 33);
});
$("zoom").addEventListener("change", fit);
function fit() { const z = Number($("zoom").value); $("stage").style.transform = `scale(${z})`; $("wrap").style.height = `${390 * z}px`; $("wrap").style.width = `${844 * z}px`; }
$("heroY").addEventListener("change", e => { hero.y = Number(e.target.value); render(); });
$("heroH").addEventListener("change", e => { hero.h = Number(e.target.value); render(); });
$("heroOn").addEventListener("change", e => { hero.on = e.target.checked; render(); });
$("camMargin").addEventListener("change", e => { hero.margin = Number(e.target.value); render(); });
$("addProps").addEventListener("click", () => { layers.push({ name: "家具", kind: "props", speed: 1, x: 0, opacity: 1, on: true, props: [] }); cards(); render(); });
$("add").addEventListener("click", () => {
  layers.push({ name: "新しい層", file: files[0] || "", kind: "image", height: 200, bottom: 390, x: 0, overlap: 0, speed: 1, repeat: false, mirror: false, opacity: 1, on: true });
  cards(); render();
});
$("reset").addEventListener("click", async () => {
  if (scene) {
    if (!confirm(`シーン「${scene}」を、はじめの値（Unity のその場面の見え方。なければ場所のふだんの写し）に戻しますか？ 合わせた値は消えます`)) return;
    localStorage.removeItem(sceneKey(scene));
    await enterScene(scene, true); cards(); render(); $("msg").textContent = "シーンをはじめの値に戻しました";
    return;
  }
  if (!confirm(`「${place}」を、はじめの値（Unity に入っている値。なければひな形）に戻しますか？ 合わせた値は消えます`)) return;
  apply(await defaultsFor(place)); baseLayersCache = clone(layers); await loadExploreMap(); listScenes(); await listFiles(); cards(); render(); $("msg").textContent = "はじめの値に戻しました";
});
$("place").addEventListener("change", async e => {
  save();
  place = e.target.value; writeJson(LAST_KEY, place);
  scene = "";
  await load(); await listFiles(); cards(); render();
});
$("newPlace").addEventListener("click", async () => {
  const id = (prompt("場所の名前（英数字と _。Unity のデータの名前になる。例: orcus_town）") || "").trim();
  if (!id) return;
  if (!/^[a-z0-9_]+$/.test(id)) { alert("英小文字・数字・_ だけにしてください"); return; }
  if (places.some(p => p.id === id)) { alert("もうある名前です"); return; }
  const folder = (prompt("素材のフォルダ（リポジトリの中の場所）", `背景/${id}/採用候補/`) || "").trim();
  if (!folder) return;
  const mine = readJson(PLACES_KEY, []); mine.push({ id, folder }); writeJson(PLACES_KEY, mine);
  save();
  place = id; writeJson(LAST_KEY, place);
  await listPlaces(); await load(); await listFiles(); cards(); render();
  $("msg").textContent = `「${id}」を足しました。素材をフォルダに入れて「読み込み直す」を押してください`;
});
$("folder").addEventListener("change", async () => { await listFiles(); cards(); render(); });
$("copy").addEventListener("click", () => copyText(exportText(), scene ? `シーン「${scene}」をコピーしました。総合担当に貼ってください` : "コピーしました。総合担当に貼ってください"));
$("scene").addEventListener("change", async e => { await enterScene(e.target.value); cards(); render(); });
$("lookName").addEventListener("input", e => { lookName = e.target.value.trim(); $("out").value = exportText(); save(); });
$("newScene").addEventListener("click", async () => {
  const id = (prompt("試しのシーンの名前（英数字と _。例: dusk_try）") || "").trim();
  if (!id) return;
  if (!/^[a-z0-9_]+$/.test(id)) { alert("英小文字・数字・_ だけにしてください"); return; }
  if (mapStates().some(s => s.id === id) || readJson(customKey(), []).some(s => s.id === id)) { alert("もうある名前です"); return; }
  const title = (prompt("説明（例: 夕方の試し）") || "").trim();
  writeJson(customKey(), [...readJson(customKey(), []), { id, title }]);
  await enterScene(id); cards(); render();
  $("msg").textContent = `シーン「${id}」を足しました（今の見え方の写しから）`;
});
// ファイルに保存・開く: この場所のふだんと全部のシーン（このブラウザの保存はブラウザを替えると見えないので）
$("saveFile").addEventListener("click", () => {
  save();
  const blob = new Blob([JSON.stringify(allExport(), null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `重ね方_${place}_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  $("msg").textContent = "ファイルに保存しました";
});
$("openFile").addEventListener("click", () => $("fileIn").click());
$("fileIn").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  let d;
  try { d = JSON.parse(await f.text()); } catch { alert("読めないファイルです"); return; }
  if (d?.kind !== "srpg.corridorLayers.place" || !d.place) { alert("「ファイルに保存」で作ったファイルではありません"); return; }
  if (!confirm(`場所「${d.place}」のふだんと ${Object.keys(d.scenes || {}).length} のシーンを、このファイルの値にしますか？（今の値は上書きされます）`)) return;
  place = d.place; writeJson(LAST_KEY, place);
  if (d.base) writeJson(storeKey(place), d.base);
  if (d.custom) writeJson(customKey(), d.custom);
  for (const [id, v] of Object.entries(d.scenes || {})) writeJson(sceneKey(id), v);
  await listPlaces(); await load(); await listFiles(); cards(); render();
  $("msg").textContent = "ファイルを読み込みました";
});
$("reload").addEventListener("click", async () => { await listFiles(); await listBackgrounds(); cards(); render(); });

(async () => {
  place = readJson(LAST_KEY, "orcus_castle");
  await listPlaces();
  await load();
  if (hero.margin === undefined) { hero.margin = 60; $("camMargin").value = 60; }
  $("hero").src = "../unity-prototype/Assets/Art/SD/young_arshe.png";
  fit();
  await listFiles();
  await listSkies();
  await listBackgrounds();
  // 新しく置いた絵を、読み込み直さなくても出す（5秒ごとに見て、増えた・消えたら選択肢を並べ直す。原作者 2026-10-04）
  setInterval(async () => {
    if (document.hidden || exDrag || document.activeElement?.tagName === "SELECT") return;   // 選んでいる最中は並べ直さない
    const before = JSON.stringify([files, bgGroups]);
    const count = () => files.length + bgGroups.reduce((n, g) => n + g.files.length, 0);
    const n0 = count();
    await listFiles();
    await listBackgrounds();
    if (JSON.stringify([files, bgGroups]) === before) return;
    const n1 = count();
    cards();
    $("msg").textContent = n1 > n0 ? `新しい絵が ${n1 - n0} 枚ふえました` : "絵の一覧が変わりました";
  }, 5000);
  cards();
  await render();
  if (ex) cards();   // 探索の配置は回廊の長さ（描いたあとに分かる）で決まるので、もう一度並べる
})();
</script>
