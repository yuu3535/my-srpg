<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>横スクロールの重ね方（デバッグ）</title>
<!--
  探索の2D横スクロール（オルクス城の回廊）の層の重ね方を、原作者がつまみで決めるデバッグ用ページ（総合担当 2026-10-03）。
  静的サーバー（リポジトリのルート）で開く: http://localhost:8931/debug/corridor_layers.html
  素材のフォルダの一覧はサーバーのフォルダ一覧から読む。決めた値は「コピー」で総合担当へ渡し、Unity の回廊に使う。
  座標はゲームの基準画面 844×390（左上が 0,0）。速さは 1 でカメラと同じ（手前）、0 で動かない（空）。
-->
<style>
  :root { color-scheme: dark; --ink: #0d1923; --panel: #142430; --line: #3a4b56; --text: #e8ece9; --muted: #9fb0b6; --teal: #67bfc1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--text); font: 13px/1.5 "Yu Gothic UI", "Meiryo", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-family: "Yu Mincho", serif; }
  header input[type=text] { width: 360px; }
  input, select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; }
  button { cursor: pointer; } button:hover { border-color: var(--teal); }
  main { display: grid; grid-template-columns: max-content 430px; gap: 12px; padding: 12px 14px; }
  #wrap { overflow: hidden; }
  #wrap { position: relative; }
  #stage { position: relative; width: 844px; height: 390px; overflow: hidden; background: #000; transform-origin: top left; }
  #stage .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; isolation: isolate; }   /* 「手前」の重なりを層の中だけにする（アルシェより前に出さない） */
  #stage img { position: absolute; display: block; user-select: none; }
  #stage .floorRow { position: absolute; background-repeat: repeat-x; }
  #stage .shade { position: absolute; left: 0; right: 0; }
  #hero { position: absolute; pointer-events: none; }
  #feet { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed rgba(103,191,193,.8); pointer-events: none; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
  .bar label { display: flex; align-items: center; gap: 6px; }
  #layers { display: grid; gap: 8px; max-height: calc(100vh - 120px); overflow-y: auto; padding-right: 4px; }
  .card { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; background: #11202a; }
  .card.off { opacity: .55; }
  .card .head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .card .head b { flex: 1; font-weight: 600; }
  .card .head button { padding: 0 6px; }
  .row { display: grid; grid-template-columns: 70px 1fr 54px; align-items: center; gap: 6px; }
  .row input[type=range] { width: 100%; }
  .row input[type=number] { width: 54px; padding: 1px 3px; }
  .card select { width: 100%; margin-bottom: 4px; }
  .modRow { display: grid; grid-template-columns: 1fr 76px 76px 24px; gap: 4px; align-items: center; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px dashed #2a3a44; }
  .modRow .front { grid-column: span 2; }
  .modRow select { margin: 0; }
  .modRow input { width: 44px; }
  .checks { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 2px; color: var(--muted); }
  #out { width: 100%; height: 120px; margin-top: 8px; font: 12px/1.4 Consolas, monospace; background: #0a141b; color: var(--text); border: 1px solid var(--line); }
  .hint { color: var(--muted); font-size: 12px; }
  #msg { color: var(--teal); }
</style>
</head>
<body>
<header>
  <h1>横スクロールの重ね方</h1>
  <label>場所 <select id="place"></select></label>
  <button id="newPlace" title="新しい場所を足す（空・遠景・中景・床・モジュールのひな形から始める）">場所を足す</button>
  <label>素材のフォルダ <input id="folder" type="text" value="背景/オルクス城回廊横スクロール/採用候補/"></label>
  <button id="reload">読み込み直す</button>
  <button id="add">層を足す</button>
  <button id="copy">コピー</button>
  <button id="reset">はじめの値に戻す</button>
  <span id="msg"></span>
</header>
<main>
  <div>
    <div id="wrap"><div id="stage"><div id="feet"></div><img id="hero" alt=""></div></div>
    <div class="bar">
      <label>カメラ <input id="cam" type="range" min="0" max="4000" value="0" style="width:340px"> <span id="camV">0</span></label>
      <button id="play">▶ 流す</button>
      <label>表示の大きさ <select id="zoom"><option value="1" selected>1倍</option><option value="1.5">1.5倍</option><option value="2">2倍</option></select></label>
    </div>
    <div class="bar">
      <label>アルシェ（大きさの目安） 足元の高さ <input id="heroY" type="number" value="352" style="width:60px"></label>
      <label>背の高さ <input id="heroH" type="number" value="96" style="width:60px"></label>
      <label><input id="heroOn" type="checkbox" checked> 出す</label>
      <label title="カメラが回廊の両端からこれだけ内側で止まる（端の外の空を見せない）">カメラの端の余白 <input id="camMargin" type="number" value="60" style="width:60px"></label>
    </div>
    <p class="hint">
      層は下の欄の上から奥→手前の順に重なります。数値はゲームの画面（844×390）での大きさです。<br>
      「くり返す」は横に並べます。「重ね幅」を増やすと継ぎ目が重なります（庭など）。「床」は真上から見た素材を縦につぶして帯にします。<br>
      決まったら「コピー」を押して、総合担当に貼ってください。動かした値はこのブラウザに残ります。
    </p>
    <textarea id="out" readonly></textarea>
  </div>
  <div id="layers"></div>
</main>
<script>
const STORE = "srpg.corridorLayers.v4";   // v4: 回廊を端つきの並びに   // v2: 遠景をつながる形に分けた（前の値は使わない）
const $ = id => document.getElementById(id);
let files = [];
let layers = [];

// 場所: Unity の場所データ（unity-prototype/Assets/Data/Corridors/<場所>.json）と、このページで足した場所（2026-10-03）
// 「はじめの値」は Unity に入っている値。Unity にまだない場所は、空・遠景・中景・床・モジュールのひな形から始める
const UNITY_DIR = "/unity-prototype/Assets/Data/Corridors/";
const PLACES_KEY = "srpg.corridorPlaces";     // このページで足した場所 [{ id, folder }]
const LAST_KEY = "srpg.corridorPlace";        // 最後に開いた場所
let place = "orcus_castle";
let places = [];                               // [{ id, folder, unity }]
// オルクス城の回廊は前からの保存の名前をそのまま使う（合わせた値を消さない）
const storeKey = id => id === "orcus_castle" ? STORE : `srpg.corridorLayers.${id}`;
const TEMPLATE = [
  { name: "空", file: "", kind: "image", height: 390, bottom: 390, x: 0, overlap: 0, speed: 0.03, repeat: true, mirror: false, opacity: 1, on: true },
  { name: "遠景", file: "", kind: "image", height: 250, bottom: 280, x: 0, overlap: 0, speed: 0.15, repeat: true, mirror: false, opacity: 1, on: true },
  { name: "中景", file: "", kind: "image", height: 210, bottom: 350, x: 0, overlap: 0, speed: 0.45, repeat: true, mirror: false, opacity: 1, on: true },
  { name: "床（真上からの素材を帯に）", file: "", kind: "floor", top: 321, bottom: 390, tile: 120, rows: 2, x: 0, speed: 1, shade: 0.5, on: true },
  { name: "モジュール（左の端・くり返し・右の端）", kind: "modules", height: 391, bottom: 390, x: 0, speed: 1, opacity: 1, on: true, modules: [] },
];

const clone = v => JSON.parse(JSON.stringify(v));
const readJson = (k, v) => { try { return JSON.parse(localStorage.getItem(k) || "null") ?? v; } catch { return v; } };
const writeJson = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

async function listPlaces() {
  let unity = [];
  try {
    const html = await (await fetch(UNITY_DIR)).text();
    unity = [...html.matchAll(/href="([^"]+)\.json"/gi)].map(m => decodeURIComponent(m[1]));
  } catch {}
  const mine = readJson(PLACES_KEY, []);
  places = [...unity.map(id => ({ id, unity: true })), ...mine.filter(m => !unity.includes(m.id))];
  if (!places.some(p => p.id === place)) places.unshift({ id: place, unity: false });
  $("place").innerHTML = places.map(p => `<option value="${p.id}" ${p.id === place ? "selected" : ""}>${p.id}${p.unity ? "" : "（Unity にまだない）"}</option>`).join("");
}

// はじめの値: Unity の場所データ。なければひな形
async function defaultsFor(id) {
  try {
    const r = await fetch(`${UNITY_DIR}${encodeURIComponent(id)}.json`, { cache: "no-store" });
    if (r.ok) {
      const d = await r.json();
      return { folder: d.folder, hero: { y: d.heroFeetY ?? 352, h: d.heroHeight ?? 96, margin: d.cameraMargin ?? 60 }, layers: d.layers.map(L => ({ ...L, on: true })) };
    }
  } catch {}
  const mine = readJson(PLACES_KEY, []).find(m => m.id === id);
  return { folder: mine?.folder || `背景/${id}/採用候補/`, hero: { y: 352, h: 96, margin: 60 }, layers: clone(TEMPLATE) };
}

function apply(state) {
  layers = state.layers;
  if (state.folder) $("folder").value = state.folder;
  if (state.hero) Object.assign(hero, state.hero);
  $("heroY").value = hero.y; $("heroH").value = hero.h; $("heroOn").checked = hero.on;
  $("camMargin").value = hero.margin;
}
async function load() {
  const s = readJson(storeKey(place), null);
  apply(s?.layers ? s : await defaultsFor(place));
}
function save() { writeJson(storeKey(place), { folder: $("folder").value, layers, hero }); }
const hero = { y: 352, h: 96, on: true, margin: 60 };

const sizes = {};   // 画像の元の大きさ（file → {w,h}）
// フォルダはリポジトリのルートから（このページは debug/ にあるので、先頭に / を付ける）
const folderUrl = () => "/" + $("folder").value.replace(/^\/+/, "").replace(/\/?$/, "/");
// 「/」で始まる名前はリポジトリのルートから（空の素材 背景/空/ など、場所のフォルダの外の絵）
function url(file) { return encodeURI(file.startsWith("/") ? file : folderUrl() + file); }
const SKY_DIR = "/背景/空/";   // 時間帯・天気の空（原作者 2026-10-04。オルクス○○＝百年戦争中の治安が最悪な頃の空）
let skyFiles = [];
async function listSkies() {
  try {
    const html = await (await fetch(encodeURI(SKY_DIR))).text();
    skyFiles = [...html.matchAll(/href="([^"]+\.(?:png|webp|jpg|jpeg))"/gi)].map(m => SKY_DIR + decodeURIComponent(m[1]).split("/").pop()).sort();
  } catch { skyFiles = []; }
}
const skyLabel = f => f.startsWith(SKY_DIR) ? `空／${f.slice(SKY_DIR.length)}` : f;
function size(file) {
  if (!file) return Promise.resolve(null);
  if (sizes[file]) return Promise.resolve(sizes[file]);
  return new Promise(ok => { const im = new Image(); im.onload = () => { sizes[file] = { w: im.naturalWidth, h: im.naturalHeight }; ok(sizes[file]); }; im.onerror = () => ok(null); im.src = url(file); });
}

async function listFiles() {
  try {
    const html = await (await fetch(encodeURI(folderUrl()))).text();
    files = [...html.matchAll(/href="([^"]+\.(?:png|webp|jpg|jpeg))"/gi)].map(m => decodeURIComponent(m[1])).sort();
    $("msg").textContent = `素材 ${files.length} 枚`;
  } catch { files = []; $("msg").textContent = "フォルダが読めません（静的サーバーで開いていますか）"; }
}

// ── 描く ──
async function render() {
  const stage = $("stage");
  stage.querySelectorAll(".layer").forEach(e => e.remove());
  // カメラは「回廊（端つきの並び）」の両端から余白だけ内側で止める（Unity と同じ）
  const corridorLen = layers.find(L => L.kind === "modules" && L.on)?._length;
  let cam = Number($("cam").value);
  if (corridorLen) { cam = Math.max(hero.margin, Math.min(cam, corridorLen - 844 - hero.margin)); $("cam").max = Math.ceil(corridorLen); }
  const feet = $("feet"), heroImg = $("hero");
  for (const L of layers) {
    if (!L.on) continue;
    const box = document.createElement("div");
    box.className = "layer";
    stage.insertBefore(box, feet);
    const shift = L.x - cam * L.speed;
    if (L.kind === "floor") {
      const h = Math.max(1, L.bottom - L.top), rows = Math.max(1, L.rows);
      for (let r = 0; r < rows; r++) {
        const row = document.createElement("div");
        row.className = "floorRow";
        const rh = h / rows;
        Object.assign(row.style, { left: 0, right: 0, top: `${L.top + r * rh}px`, height: `${rh + 0.5}px`,
          backgroundImage: L.file ? `url("${url(L.file)}")` : "repeating-linear-gradient(90deg,#5c5866 0 58px,#3d3a46 58px 60px)",
          backgroundSize: `${L.tile}px ${rh + 0.5}px`, backgroundPosition: `${shift}px 0` });
        box.appendChild(row);
      }
      const shade = document.createElement("div");
      shade.className = "shade";
      Object.assign(shade.style, { top: `${L.top}px`, height: `${h}px`, background: `linear-gradient(180deg, rgba(10,14,22,${L.shade}), rgba(10,14,22,0))` });
      box.appendChild(shade);
      continue;
    }
    if (L.kind === "modules") {
      let cursor = 0;
      for (let m = 0; m < (L.modules || []).length; m++) {
        const mod = L.modules[m];
        const ms = await size(mod.file);
        if (!ms) continue;
        const mw = ms.w * (L.height / ms.h);
        if (m > 0) cursor -= Number(mod.overlap || 0);
        const sc = Number(mod.scale || 1), w2 = mw * sc, h2 = L.height * sc;
        const left = shift + cursor + Number(mod.dx || 0) - (w2 - mw) / 2, top = L.bottom - h2 + Number(mod.dy || 0);
        if (Number(mod.shadeTop) > 0) {
          // 絵の上の透けた三角から空が見えないよう、後ろに暗い天井の色を敷く（Unity と同じ色）
          const shade = document.createElement("div");
          Object.assign(shade.style, { position: "absolute", left: `${left}px`, top: `${top}px`, width: `${w2}px`, height: `${Number(mod.shadeTop)}px`, background: "rgb(28,24,34)", opacity: L.opacity, zIndex: 0 });   // 「手前」でも天井はいちばん奥（となりの絵の上に出さない）
          box.appendChild(shade);
        }
        const img = document.createElement("img");
        img.src = url(mod.file);
        Object.assign(img.style, { left: `${left}px`, top: `${top}px`, width: `${w2}px`, height: `${h2}px`, opacity: L.opacity,
          zIndex: mod.front ? 2 : 1 });
        box.appendChild(img);
        cursor += mw;
      }
      L._length = cursor;
      continue;
    }
    const s = await size(L.file);
    if (!s) continue;
    const w = s.w * (L.height / s.h);
    const step = Math.max(8, w - (L.overlap || 0));
    let start = shift;
    if (L.repeat) { start = shift % step; if (start > 0) start -= step; }
    for (let i = 0, x = start; x < 844 && (L.repeat || i === 0); i++, x += step) {
      const img = document.createElement("img");
      img.src = url(L.file);
      Object.assign(img.style, { left: `${x}px`, top: `${L.bottom - L.height}px`, width: `${w}px`, height: `${L.height}px`, opacity: L.opacity,
        transform: L.mirror && i % 2 ? "scaleX(-1)" : "none" });
      box.appendChild(img);
    }
  }
  feet.style.top = `${hero.y}px`;
  feet.style.display = hero.on ? "" : "none";
  heroImg.style.display = hero.on ? "" : "none";
  Object.assign(heroImg.style, { height: `${hero.h}px`, top: `${hero.y - hero.h}px`, left: `${422 - hero.h * 0.28}px` });
  $("camV").textContent = cam;
  $("out").value = exportText();
  save();
}

function exportText() {
  const used = layers.filter(L => L.on).map(L => {
    const o = { name: L.name, kind: L.kind, file: L.file, speed: L.speed, x: L.x };
    if (L.kind === "floor") Object.assign(o, { top: L.top, bottom: L.bottom, tile: L.tile, rows: L.rows, shade: L.shade });
    else if (L.kind === "modules") { delete o.file; Object.assign(o, { height: L.height, bottom: L.bottom, opacity: L.opacity, modules: L.modules.map(m => ({ file: m.file, overlap: Number(m.overlap || 0), dy: Number(m.dy || 0), dx: Number(m.dx || 0), scale: Number(m.scale || 1), front: !!m.front, shadeTop: Number(m.shadeTop || 0) })) }); }
    else Object.assign(o, { height: L.height, bottom: L.bottom, overlap: L.overlap, repeat: L.repeat, mirror: L.mirror, opacity: L.opacity });
    return o;
  });
  return JSON.stringify({ corridor: place, folder: $("folder").value, screen: [844, 390], heroFeetY: hero.y, heroHeight: hero.h, cameraMargin: hero.margin, layers: used }, null, 1);
}

// ── 欄 ──
function slider(L, key, label, min, max, step) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${L[key]}"><input type="number" step="${step}" value="${L[key]}">`;
  const [range, num] = row.querySelectorAll("input");
  const set = v => { L[key] = Number(v); range.value = v; num.value = v; render(); };
  range.addEventListener("input", () => set(range.value));
  num.addEventListener("change", () => set(num.value));
  return row;
}
function check(L, key, label) {
  const lab = document.createElement("label");
  lab.innerHTML = `<input type="checkbox" ${L[key] ? "checked" : ""}> ${label}`;
  lab.querySelector("input").addEventListener("change", e => { L[key] = e.target.checked; render(); });
  return lab;
}
function cards() {
  const host = $("layers");
  host.innerHTML = "";
  layers.forEach((L, i) => {
    const card = document.createElement("div");
    card.className = "card" + (L.on ? "" : " off");
    const head = document.createElement("div");
    head.className = "head";
    head.innerHTML = `<input type="checkbox" ${L.on ? "checked" : ""} title="出す"><b contenteditable="true">${L.name}</b><button title="奥へ">↑</button><button title="手前へ">↓</button><button title="消す">×</button>`;
    const [on, , up, down, del] = head.children;
    on.addEventListener("change", () => { L.on = on.checked; cards(); render(); });
    head.querySelector("b").addEventListener("input", e => { L.name = e.target.textContent; $("out").value = exportText(); save(); });
    up.addEventListener("click", () => { if (i > 0) { [layers[i - 1], layers[i]] = [layers[i], layers[i - 1]]; cards(); render(); } });
    down.addEventListener("click", () => { if (i < layers.length - 1) { [layers[i + 1], layers[i]] = [layers[i], layers[i + 1]]; cards(); render(); } });
    del.addEventListener("click", () => { layers.splice(i, 1); cards(); render(); });
    card.appendChild(head);
    if (L.kind === "modules") {
      // 並べる絵: 1つずつ「絵・左と重ねる幅・上下のずれ」。＋で足す、×で消す
      L.modules.forEach((mod, m) => {
        const row = document.createElement("div");
        row.className = "modRow";
        row.innerHTML = `<select>${files.map(f => `<option ${f === mod.file ? "selected" : ""}>${f}</option>`).join("")}</select>`
          + `<label>重ね <input type="number" value="${mod.overlap}" ${m === 0 ? "disabled" : ""}></label><label>上下 <input type="number" value="${mod.dy}"></label><button title="消す">×</button>`
          + `<label>左右 <input type="number" value="${mod.dx || 0}"></label><label>大きさ <input type="number" step="0.01" value="${mod.scale || 1}"></label><label title="絵の上からこの高さまで、後ろに暗い天井の色を敷く（端の上の三角から空が見えるとき）">天井 <input type="number" value="${mod.shadeTop || 0}"></label><label class="front"><input type="checkbox" ${mod.front ? "checked" : ""}> 手前</label>`;
        const [msel] = row.getElementsByTagName("select");
        const [ov, dy, dxIn, scIn, shIn, frontIn] = row.querySelectorAll("input");
        shIn.addEventListener("input", () => { mod.shadeTop = Number(shIn.value); render(); });
        dxIn.addEventListener("input", () => { mod.dx = Number(dxIn.value); render(); });
        scIn.addEventListener("input", () => { mod.scale = Number(scIn.value) || 1; render(); });
        frontIn.addEventListener("change", () => { mod.front = frontIn.checked; render(); });
        msel.addEventListener("change", () => { mod.file = msel.value; render(); });
        ov.addEventListener("input", () => { mod.overlap = Number(ov.value); render(); });
        dy.addEventListener("input", () => { mod.dy = Number(dy.value); render(); });
        row.querySelector("button").addEventListener("click", () => { L.modules.splice(m, 1); cards(); render(); });
        card.appendChild(row);
      });
      const add = document.createElement("button");
      add.textContent = "＋ 絵を足す";
      add.addEventListener("click", () => { const last = L.modules[L.modules.length - 1]; L.modules.push({ file: last?.file || files[0], overlap: 39, dy: 0 }); cards(); render(); });
      card.appendChild(add);
      card.appendChild(slider(L, "height", "高さ", 20, 800, 1));
      card.appendChild(slider(L, "bottom", "下の端", 0, 500, 1));
      card.appendChild(slider(L, "x", "横の位置", -1000, 2000, 1));
      card.appendChild(slider(L, "speed", "流れる速さ", 0, 1.5, 0.01));
      host.appendChild(card);
      return;
    }
    const sel = document.createElement("select");
    sel.innerHTML = `<option value="">（素材なし${L.kind === "floor" ? "・仮の縞" : ""}）</option>` + files.map(f => `<option ${f === L.file ? "selected" : ""}>${f}</option>`).join("")
      + (L.kind === "image" && skyFiles.length ? `<optgroup label="背景/空/（時間帯・天気）">${skyFiles.map(f => `<option value="${f}" ${f === L.file ? "selected" : ""}>${skyLabel(f)}</option>`).join("")}</optgroup>` : "");
    sel.addEventListener("change", () => { L.file = sel.value; render(); });
    card.appendChild(sel);
    if (L.kind === "floor") {
      card.appendChild(slider(L, "top", "上の端", 200, 390, 1));
      card.appendChild(slider(L, "bottom", "下の端", 250, 420, 1));
      card.appendChild(slider(L, "tile", "素材の幅", 20, 400, 1));
      card.appendChild(slider(L, "rows", "段の数", 1, 6, 1));
      card.appendChild(slider(L, "shade", "奥の暗さ", 0, 1, 0.05));
    } else {
      card.appendChild(slider(L, "height", "高さ", 20, 800, 1));
      card.appendChild(slider(L, "bottom", "下の端", 0, 500, 1));
      card.appendChild(slider(L, "overlap", "重ね幅", 0, 400, 1));
      card.appendChild(slider(L, "opacity", "濃さ", 0, 1, 0.05));
    }
    card.appendChild(slider(L, "x", "横の位置", -1000, 2000, 1));
    card.appendChild(slider(L, "speed", "流れる速さ", 0, 1.5, 0.01));
    if (L.kind !== "floor") {
      const checks = document.createElement("div");
      checks.className = "checks";
      checks.appendChild(check(L, "repeat", "くり返す"));
      checks.appendChild(check(L, "mirror", "1つおきに左右反転"));
      card.appendChild(checks);
    }
    host.appendChild(card);
  });
}

// ── 操作 ──
$("cam").addEventListener("input", render);
let timer = null;
$("play").addEventListener("click", () => {
  if (timer) { clearInterval(timer); timer = null; $("play").textContent = "▶ 流す"; return; }
  $("play").textContent = "■ 止める";
  timer = setInterval(() => { const c = $("cam"); c.value = (Number(c.value) + 4) % Number(c.max); render(); }, 33);
});
$("zoom").addEventListener("change", fit);
function fit() { const z = Number($("zoom").value); $("stage").style.transform = `scale(${z})`; $("wrap").style.height = `${390 * z}px`; $("wrap").style.width = `${844 * z}px`; }
$("heroY").addEventListener("change", e => { hero.y = Number(e.target.value); render(); });
$("heroH").addEventListener("change", e => { hero.h = Number(e.target.value); render(); });
$("heroOn").addEventListener("change", e => { hero.on = e.target.checked; render(); });
$("camMargin").addEventListener("change", e => { hero.margin = Number(e.target.value); render(); });
$("add").addEventListener("click", () => {
  layers.push({ name: "新しい層", file: files[0] || "", kind: "image", height: 200, bottom: 390, x: 0, overlap: 0, speed: 1, repeat: false, mirror: false, opacity: 1, on: true });
  cards(); render();
});
$("reset").addEventListener("click", async () => {
  if (!confirm(`「${place}」を、はじめの値（Unity に入っている値。なければひな形）に戻しますか？ 合わせた値は消えます`)) return;
  apply(await defaultsFor(place)); await listFiles(); cards(); render(); $("msg").textContent = "はじめの値に戻しました";
});
$("place").addEventListener("change", async e => {
  save();
  place = e.target.value; writeJson(LAST_KEY, place);
  await load(); await listFiles(); cards(); render();
});
$("newPlace").addEventListener("click", async () => {
  const id = (prompt("場所の名前（英数字と _。Unity のデータの名前になる。例: orcus_town）") || "").trim();
  if (!id) return;
  if (!/^[a-z0-9_]+$/.test(id)) { alert("英小文字・数字・_ だけにしてください"); return; }
  if (places.some(p => p.id === id)) { alert("もうある名前です"); return; }
  const folder = (prompt("素材のフォルダ（リポジトリの中の場所）", `背景/${id}/採用候補/`) || "").trim();
  if (!folder) return;
  const mine = readJson(PLACES_KEY, []); mine.push({ id, folder }); writeJson(PLACES_KEY, mine);
  save();
  place = id; writeJson(LAST_KEY, place);
  await listPlaces(); await load(); await listFiles(); cards(); render();
  $("msg").textContent = `「${id}」を足しました。素材をフォルダに入れて「読み込み直す」を押してください`;
});
$("folder").addEventListener("change", async () => { await listFiles(); cards(); render(); });
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(exportText()); $("msg").textContent = "コピーしました。総合担当に貼ってください"; }
  catch { $("out").select(); document.execCommand("copy"); $("msg").textContent = "コピーしました（下の欄）"; }
});
$("reload").addEventListener("click", async () => { await listFiles(); cards(); render(); });

(async () => {
  place = readJson(LAST_KEY, "orcus_castle");
  await listPlaces();
  await load();
  if (hero.margin === undefined) { hero.margin = 60; $("camMargin").value = 60; }
  $("hero").src = "../unity-prototype/Assets/Art/SD/young_arshe.png";
  fit();
  await listFiles();
  await listSkies();
  cards();
  render();
})();
</script>
</body>
</html>
