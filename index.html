<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>自作SRPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=M+PLUS+1:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="gameScreen">

        <!-- ─── 上部パネル ─── -->
        <div id="topPanel">

            <!-- 上パネル専用背景（シナリオ・バトルで個別設定可） -->
            <img id="topPanelBg" class="panelBg" src="assets/background_forest.png" alt="" />
            <div id="topPanelTint" class="panelTint"></div>

            <!-- 会話レイヤー -->
            <div id="topLayerDialogue" class="topLayer">
                <div id="scenarioCharLayer"></div>
                <div id="dialogueBox">
                    <div id="nameText">リングホルム</div>
                    <div id="messageText">……この森、静かすぎる。気を抜くな。</div>
                </div>
            </div>

            <!-- 予測レイヤー -->
            <div id="topLayerForecast" class="topLayer hidden">
                <div id="forecastContent"></div>
            </div>

            <!-- 戦況レイヤー -->
            <div id="topLayerBattle" class="topLayer hidden">
                <div id="phaseHeader">
                    <span id="phaseLabel">――</span>
                    <span id="turnLabel"></span>
                </div>
                <div id="logPanel">
                    <div id="logTextList"></div>
                </div>
            </div>

            <!-- タブ -->
            <div id="topTabs">
                <button class="topTab active" data-layer="dialogue">会話</button>
                <button class="topTab"        data-layer="battle">戦況</button>
                <button class="topTab"        data-layer="forecast">予測</button>
            </div>

        </div>

        <!-- ─── バトル盤面 ─── -->
        <div id="battleBoard">
            <!-- マップパネル専用背景 -->
            <img id="bgImage" class="panelBg" src="assets/background_forest.png" alt="背景" />
            <div id="battleBoardTint"></div>
            <div id="battleGrid"></div>
            <div id="unitLayer"></div>
        </div>

        <!-- ラジアルメニュー（#gameScreen直下でクリッピングされない） -->
        <div id="radialMenu" class="hidden"></div>

        <!-- ─── 下部パネル ─── -->
        <div id="bottomPanel">
            <div id="commandPanel">
                <div id="commandHeader">command</div>
                <div id="commandInfo"></div>
                <div id="commandList"></div>
            </div>
            <div id="modeButtons">
                <button id="scenarioModeButton" class="modeButton">シナリオ</button>
                <button id="battleModeButton"   class="modeButton">バトル</button>
            </div>
        </div>

        <!-- フェーズバナー -->
        <div id="phaseBanner" class="hidden"></div>

        <!-- ─── ホーム画面 ─── -->
        <div id="homeScreen">
            <img id="homeScreenBg" src="立ち絵AI生成/ホーム画面用(仮).png" alt="" />
            <div id="homeScreenOverlay"></div>
            <div id="homeScreenContent">
                <div id="homeTitle">
                    百年戦争編
                    <span id="homeTitleSub">（仮）</span>
                </div>
                <div id="homeButtons">
                    <button class="homeButton" id="homeStartBtn">はじめから</button>
                    <button class="homeButton" id="homeContinueBtn" disabled>つづきから</button>
                    <button class="homeButton" id="homeSettingsBtn" disabled>設定</button>
                </div>
            </div>
        </div>

        <!-- FEH風バトル予測パネル -->
        <div id="battlePreviewPanel" class="hidden">
            <div class="bpInner">
                <!-- 攻撃側 -->
                <div class="bpUnit" id="bpAtkSide">
                    <div class="bpPortrait" id="bpAtkPortrait"></div>
                    <div class="bpUnitInfo">
                        <div class="bpUnitName" id="bpAtkName">―</div>
                        <div class="bpHpRow">
                            <div class="bpHpBar"><div class="bpHpFill" id="bpAtkHpFill"></div></div>
                            <span class="bpHpNum" id="bpAtkHpNum">0/0</span>
                        </div>
                    </div>
                </div>
                <!-- 中央予測 -->
                <div class="bpCenter">
                    <div class="bpPredRow bpAtkRow">
                        <span class="bpLabel">命中</span>
                        <span class="bpVal bpHitVal" id="bpAtkHit">―%</span>
                        <span class="bpSep">/</span>
                        <span class="bpLabel">ダメ</span>
                        <span class="bpVal bpDmgVal bpAtkDmgVal" id="bpAtkDmg">―</span>
                    </div>
                    <div class="bpCtrTag" id="bpCtrTag">反撃あり</div>
                    <div class="bpPredRow bpDefRow" id="bpDefPredRow">
                        <span class="bpLabel">命中</span>
                        <span class="bpVal bpHitVal" id="bpDefHit">―%</span>
                        <span class="bpSep">/</span>
                        <span class="bpLabel">ダメ</span>
                        <span class="bpVal bpDmgVal bpDefDmgVal" id="bpDefDmg">―</span>
                    </div>
                    <div class="bpBtns">
                        <button id="bpCancelBtn" class="bpBtn bpCancelBtn">キャンセル</button>
                        <button id="bpConfirmBtn" class="bpBtn bpConfirmBtn">攻撃実行</button>
                    </div>
                </div>
                <!-- 防御側 -->
                <div class="bpUnit" id="bpDefSide">
                    <div class="bpPortrait" id="bpDefPortrait"></div>
                    <div class="bpUnitInfo">
                        <div class="bpUnitName" id="bpDefName">―</div>
                        <div class="bpHpRow">
                            <div class="bpHpBar"><div class="bpHpFill" id="bpDefHpFill"></div></div>
                            <span class="bpHpNum" id="bpDefHpNum">0/0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ステータスモーダル -->
        <div id="statusModalOverlay" class="hidden">
            <div id="statusModal">
                <div id="statusModalHeader">
                    <span id="statusModalTitle">ステータス</span>
                    <button id="closeStatusModal">×</button>
                </div>
                <div id="statusTabs">
                    <button class="statusTab active" data-tab="basic">基本</button>
                    <button class="statusTab" data-tab="battle">特技</button>
                    <button class="statusTab" data-tab="magic">魔法</button>
                    <button class="statusTab" data-tab="special">その他</button>
                </div>
                <div id="statusModalBody"></div>
            </div>
        </div>

    </div>

    <script src="characters.js"></script>
    <script src="skills.js"></script>
    <script src="magics.js"></script>
    <script src="spells.js"></script>
    <script src="dataHelper.js"></script>
    <script src="scenario.js"></script>
    <script src="game.js"></script>
</body>

</html>
