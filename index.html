<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>自作SRPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=M+PLUS+1:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=phase-simple-1" />
</head>

<body>
    <div id="gameScreen" data-theme="orcus">

        <!-- ─── 上部パネル ─── -->
        <div id="topPanel">

            <!-- 上パネル専用背景（シナリオ・バトルで個別設定可） -->
            <img id="topPanelBg" class="panelBg" src="assets/background_forest.png" alt="" />
            <div id="topPanelTint" class="panelTint"></div>

            <!-- 会話レイヤー -->
            <div id="topLayerDialogue" class="topLayer">
                <div id="scenarioCharLayer"></div>
                <div id="dialogueBox">
                    <div id="scenarioSpeakerBadge" aria-hidden="true">
                        <div id="scenarioSpeakerPortrait"></div>
                    </div>
                    <div id="nameText">リングホルム</div>
                    <div id="messageText">……この森、静かすぎる。気を抜くな。</div>
                </div>
            </div>

            <!-- 予測レイヤー -->
            <div id="topLayerForecast" class="topLayer hidden">
                <div id="forecastContent"></div>
            </div>

            <!-- 戦況レイヤー -->
            <div id="topLayerBattle" class="topLayer hidden">
                <div id="phaseHeader">
                    <span id="phaseLabel">――</span>
                    <span id="turnLabel"></span>
                </div>
                <div id="logPanel">
                    <div id="logTextList"></div>
                </div>
            </div>

            <!-- FEH風 VS レイヤー（攻撃対象選択時） -->
            <div id="topLayerVS" class="topLayer hidden">
                <div id="vsWrap">
                    <!-- 攻撃側 -->
                    <div class="vsUnit">
                        <div class="vsFaceIcon">
                            <img id="vsAtkImg" src="" alt="" />
                            <span class="vsFaceChar" id="vsAtkChar"></span>
                        </div>
                        <div class="vsUnitInfo">
                            <div class="vsUnitName" id="vsAtkName">―</div>
                            <div class="vsHpWrap">
                                <div class="vsHpBar"><div class="vsHpFill" id="vsAtkHpFill"></div></div>
                                <span class="vsHpNum" id="vsAtkHpNum">0/0</span>
                            </div>
                        </div>
                    </div>
                    <!-- 中央予測 + ボタン -->
                    <div class="vsMiddle" id="vsMiddle">
                        <div class="vsActionName" id="vsActionName"></div>
                        <div class="vsStatRow">
                            <span class="vsDir">→</span>
                            <span class="vsStatLabel">命中</span>
                            <span class="vsStatVal vsHitVal" id="vsAtkHit">―%</span>
                            <span class="vsStatSep">/</span>
                            <span class="vsStatLabel">ダメ</span>
                            <span class="vsStatVal vsAtkDmgVal" id="vsAtkDmg">―</span>
                        </div>
                        <div class="vsCtrTag" id="vsCtrTag">反撃あり</div>
                        <div class="vsStatRow" id="vsDefStatRow">
                            <span class="vsDir vsDirDef">←</span>
                            <span class="vsStatLabel">命中</span>
                            <span class="vsStatVal vsHitVal" id="vsDefHit">―%</span>
                            <span class="vsStatSep">/</span>
                            <span class="vsStatLabel">ダメ</span>
                            <span class="vsStatVal vsDefDmgVal" id="vsDefDmg">―</span>
                        </div>
                        <div class="vsButtons">
                            <button id="vsCancelBtn"  class="vsBtn vsBtnCancel">キャンセル</button>
                            <button id="vsConfirmBtn" class="vsBtn vsBtnConfirm">攻撃実行</button>
                        </div>
                        <!-- ポートレート位置調整ツール（開発用） -->
                        <button id="vsAdjustToggle" class="vsBtn" style="font-size:9px;padding:3px 7px;background:rgba(40,20,60,0.85);border-color:rgba(160,80,255,0.4);color:#c0a0ff">調整</button>
                    </div>
                    <!-- 防御側 -->
                    <div class="vsUnit">
                        <div class="vsFaceIcon">
                            <img id="vsDefImg" src="" alt="" />
                            <span class="vsFaceChar" id="vsDefChar"></span>
                        </div>
                        <div class="vsUnitInfo">
                            <div class="vsUnitName" id="vsDefName">―</div>
                            <div class="vsHpWrap">
                                <div class="vsHpBar"><div class="vsHpFill" id="vsDefHpFill"></div></div>
                                <span class="vsHpNum" id="vsDefHpNum">0/0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- タブ -->
            <div id="topTabs">
                <button class="topTab active" data-layer="dialogue">会話</button>
                <button class="topTab"        data-layer="battle">戦況</button>
                <button class="topTab"        data-layer="forecast">予測</button>
                <div id="modeButtons">
                    <button id="scenarioModeButton" class="modeButton">シナリオ</button>
                    <button id="battleModeButton"   class="modeButton">バトル</button>
                </div>
            </div>

        </div>

        <!-- ─── バトル盤面 ─── -->
        <div id="battleBoard">
            <!-- マップパネル専用背景 -->
            <img id="bgImage" class="panelBg" src="assets/background_forest.png" alt="背景" />
            <div id="battleBoardTint"></div>
            <!-- ズーム・パン対象キャンバス -->
            <div id="battleCanvas">
                <div id="battleGrid"></div>
                <div id="unitLayer"></div>
            </div>
            <!-- ズームボタン -->
            <div id="mapZoomBtns">
                <button class="mapZoomBtn" id="mapZoomIn">＋</button>
                <button class="mapZoomBtn" id="mapZoomOut">－</button>
                <button class="mapZoomBtn" id="mapZoomReset">⤢</button>
                <button class="mapZoomBtn mapViewBtn" id="mapViewToggle">視点</button>
                <button class="mapZoomBtn dangerRangeBtn" id="dangerRangeToggle" type="button"
                        aria-pressed="false" title="敵全体の危険域を表示">危険域</button>
            </div>
        </div>

        <!-- 横画面戦闘専用UI -->
        <div id="landscapeBattleShell" aria-hidden="true">
            <div id="landscapeTopStrip">
                <div id="landscapePhaseTitle">味方フェーズ</div>
                <div id="landscapeTurnChip">TURN 1　敵行動予告 0</div>
            </div>
            <aside id="landscapeUnitPanel">
                <div id="landscapeUnitEmpty">ユニットを選択</div>
                <div id="landscapeUnitContent"></div>
            </aside>
            <div id="landscapeBattlefield"></div>
            <aside id="landscapeCommandPanel">
                <div id="landscapeCommandCurve"></div>
                <div id="landscapeCommandList"></div>
            </aside>
            <div id="landscapeHint">敵の宣言を確認し、攻撃線から外れるか、移動先を塞いで行動を崩せます。</div>
            <!-- FE風 戦闘予測オーバーレイ -->
            <div id="lsForecast" class="hidden" role="dialog" aria-label="戦闘予測" aria-hidden="true"></div>
        </div>

        <!-- ラジアルメニュー（#gameScreen直下でクリッピングされない） -->
        <div id="radialMenu" class="hidden"></div>

        <!-- ─── 下部パネル ─── -->
        <div id="bottomPanel">
            <div id="commandPanel">
                <div id="commandHeader">command</div>
                <div id="commandInfo"></div>
                <div id="commandList"></div>
            </div>
        </div>

        <!-- フェーズバナー -->
        <div id="phaseBanner" class="hidden"></div>

        <!-- ─── ホーム画面 ─── -->
        <div id="homeScreen">
            <img id="homeScreenBg" src="立ち絵AI生成/ホーム画面用(仮).png" alt="" />
            <div id="homeScreenOverlay"></div>
            <div id="homeScreenContent">
                <div id="homeTitle">
                    <div class="homeTitleDeco"><span>◆</span></div>
                    <p class="homeTitleMain">百年戦争編</p>
                    <p class="homeTitleEn">THE HUNDRED YEARS' WAR</p>
                    <div class="homeTitleDeco"><span>◆</span></div>
                </div>
                <div id="homeButtons">
                    <div id="homeMenuCursor"></div>
                    <button class="homeButton homeButtonPrimary" id="homeStartBtn">はじめから</button>
                    <button class="homeButton" id="homeContinueBtn" disabled>つづきから</button>
                    <button class="homeButton homeButtonTertiary" id="homeSettingsBtn" disabled>設定</button>
                </div>
            </div>
            <div id="debugBattleMenu" aria-label="開発用戦闘ランチャー">
                <div class="debugBattleLabel">DEBUG</div>
                <button id="debugStoryBattleBtn" class="debugBattleButton" type="button">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M3 3.5h4.5L9 5h4v7.5H3z" />
                        <path d="M5.2 8h5.6M8 5.7v4.6" />
                    </svg>
                    <span>通常戦闘</span>
                </button>
                <button id="debugTestBattleBtn" class="debugBattleButton" type="button">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M5 2.5h6M6 2.5v3l-3 6.2c-.4.8.2 1.8 1.1 1.8h7.8c.9 0 1.5-1 1.1-1.8L10 5.5v-3" />
                        <path d="M4.4 10h7.2" />
                    </svg>
                    <span>テスト戦闘</span>
                </button>
            </div>
            <div id="homeVersion">ver. 0.1　(仮)</div>
        </div>

        <!-- ローディング画面 -->
        <div id="loadingScreen"></div>

        <!-- ステータスモーダル -->
        <div id="statusModalOverlay" class="hidden">
            <div id="statusModal">
                <div id="statusModalHeader">
                    <span id="statusModalTitle">ステータス</span>
                    <button id="closeStatusModal">×</button>
                </div>
                <div id="statusTabs">
                    <button class="statusTab active" data-tab="basic">基本</button>
                    <button class="statusTab" data-tab="skills">スキル</button>
                </div>
                <div id="statusModalBody"></div>
            </div>
        </div>

    </div>

    <script src="characters.js?v=raw-fe-stats-1"></script>
    <script src="skills.js"></script>
    <script src="magics.js"></script>
    <script src="spells.js"></script>
    <script src="statConversion.js?v=raw-fe-stats-1"></script>
    <script src="dataHelper.js?v=raw-fe-stats-1"></script>
    <script src="battleDefinitions.js?v=battle-entry-1"></script>
    <script src="partyState.js?v=party-state-1"></script>
    <script src="scenario.js"></script>
    <script src="game.js?v=phase-simple-1"></script>
</body>

</html>
